<style>
/* ============================================================
   AutoTaxo — design tokens
   Direction: industrial inspection workstation + safety orange.
   Signature motif: evidence track + instrument typography.
   ============================================================ */

:root {
  /* --- surfaces --- */
  --canvas: #EEF0EF;
  --surface: #FAFAF8;
  --surface-2: #F4F5F2;
  --surface-3: #E7E9E6;
  --rail: #E2E4E1;
  --rail-2: #D9DCD8;
  --rail-line: #C9CDC8;
  --rail-text: #555C5C;
  --rail-text-hi: #202428;

  /* --- ink --- */
  --text: #24282D;
  --text-2: #51585B;
  --text-3: #72797A;
  --text-inv: #FFFFFF;

  /* --- lines --- */
  --line: #D4D8D4;
  --line-2: #E3E6E2;
  --line-strong: #B9BFBA;

  /* --- accent --- */
  --accent: #E55B20;
  --accent-hover: #C94A16;
  --accent-press: #A93C12;
  --accent-soft: #FBE9DF;
  --accent-soft-2: #F5D4C2;
  --accent-line: #E9AE8C;

  /* --- semantic --- */
  --new: #247A52;
  --new-soft: #E4EFE9;
  --used: #A45B17;
  --used-soft: #F5EBDD;
  --mixed: #6D5A8E;
  --mixed-soft: #ECE8F1;
  --unknown: #666D6D;
  --unknown-soft: #E8EAE8;
  --danger: #B63A32;
  --danger-soft: #F5E4E2;
  --warn: #9C5C16;
  --warn-soft: #F4E9D8;
  --ok: #247A52;
  --ok-soft: #E4EFE9;
  --info: #3D6474;
  --info-soft: #E3EBEE;

  /* --- radii --- */
  --r-xs: 2px;
  --r-sm: 3px;
  --r-md: 4px;
  --r-lg: 6px;
  --r-pill: 999px;

  /* --- elevation --- */
  --sh-1: none;
  --sh-2: 0 1px 3px rgba(36, 40, 45, 0.08);
  --sh-3: 0 10px 28px rgba(36, 40, 45, 0.16);
  --sh-4: 0 24px 60px rgba(36, 40, 45, 0.24);

  /* --- type --- */
  --font: "Microsoft YaHei UI", "PingFang SC", "Microsoft YaHei",
          system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Bahnschrift", "Cascadia Mono", Consolas, ui-monospace, monospace;

  --fs-11: 11px;
  --fs-12: 12px;
  --fs-13: 13px;
  --fs-14: 14px;
  --fs-15: 15px;
  --fs-16: 16px;
  --fs-18: 18px;
  --fs-20: 20px;
  --fs-24: 24px;
  --fs-30: 30px;

  /* --- space --- */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 20px;
  --s6: 24px;
  --s8: 32px;
  --s10: 40px;

  /* --- metrics --- */
  --rail-w: 218px;
  --topbar-h: 60px;
  --row-h: 40px;

  /* --- motion --- */
  --t-fast: 110ms cubic-bezier(0.4, 0, 0.2, 1);
  --t-mid: 200ms cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--canvas);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-14);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4, p, figure { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button { cursor: pointer; border: 0; background: none; padding: 0; }
button, a, input, select, textarea { touch-action: manipulation; }

a { color: var(--accent); text-decoration: none; }

table { border-collapse: collapse; border-spacing: 0; width: 100%; }

svg { display: block; }

.mono { font-family: var(--mono); font-variant-ligatures: none; }
.num { font-variant-numeric: tabular-nums; }

::selection { background: var(--accent-soft-2); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}

.sr {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

.skip-link {
  position: fixed;
  left: 12px;
  top: 12px;
  z-index: 200;
  padding: 9px 12px;
  color: #FFFFFF;
  background: var(--text);
  border-left: 3px solid var(--accent);
  transform: translateY(-160%);
  transition: transform var(--t-fast);
}
.skip-link:focus { transform: translateY(0); }

@media (max-width: 640px) {
  .input, .select, .textarea { font-size: 16px; }
}

/* scrollbars */
* { scrollbar-width: thin; scrollbar-color: #B9BFBA transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: #B9BFBA;
  border: 3px solid transparent;
  border-radius: 99px;
  background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover { background: #8E9690; background-clip: content-box; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}
</style>
<style>
/* ============================================================
   App shell + shared component families
   ============================================================ */

.app {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  min-height: 100vh;
}

/* ---------------- rail ---------------- */

.rail {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--rail);
  border-right: 1px solid var(--rail-line);
  color: var(--rail-text);
  z-index: 30;
}

.rail__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 18px 16px;
  color: var(--rail-text-hi);
}

.brandmark {
  flex: none;
  width: 30px; height: 30px;
  border-radius: var(--r-sm);
  background: var(--text);
  position: relative;
  box-shadow: inset 0 -3px 0 var(--accent);
}
.brandmark::before,
.brandmark::after {
  content: "";
  position: absolute;
  background: #fff;
  border-radius: 2px;
}
/* the "snap to standard" glyph: two bars aligning onto a baseline */
.brandmark::before {
  left: 7px; top: 9px;
  width: 9px; height: 2.5px;
  box-shadow: 0 11px 0 #fff;
  opacity: 0.72;
}
.brandmark::after {
  right: 7px; top: 9px;
  width: 5px; height: 2.5px;
  box-shadow: 0 11px 0 #fff;
}

.rail__brand-text { display: flex; flex-direction: column; min-width: 0; }
.rail__brand-text b {
  font-size: var(--fs-15);
  font-weight: 650;
  letter-spacing: 0.01em;
  line-height: 1.25;
}
.rail__brand-text i {
  font-style: normal;
  font-size: var(--fs-11);
  color: var(--text-3);
  letter-spacing: 0.02em;
  line-height: 1.4;
  white-space: nowrap;
}

.rail__nav {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 6px 10px 12px;
}

.rail__group {
  padding: 14px 8px 6px;
  font-size: var(--fs-11);
  font-weight: 600;
  letter-spacing: 0.08em;
  color: #777E7B;
  text-transform: uppercase;
}

.navitem {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--r-sm);
  color: var(--rail-text);
  font-size: var(--fs-13);
  font-weight: 500;
  text-align: left;
  transition: background var(--t-fast), color var(--t-fast);
}
.navitem svg { flex: none; opacity: 0.82; }
.navitem:hover { background: rgba(255, 255, 255, 0.5); color: var(--text); }
.navitem.is-active {
  background: var(--surface);
  color: var(--text);
  box-shadow: inset 3px 0 0 var(--accent), inset 0 0 0 1px var(--line);
}
.navitem.is-active svg { opacity: 1; color: var(--accent); }
.navitem__label { flex: 1; min-width: 0; }
.navitem__badge {
  flex: none;
  min-width: 20px;
  height: 18px;
  padding: 0 6px;
  border-radius: var(--r-pill);
  background: rgba(36, 40, 45, 0.08);
  color: var(--text-2);
  font-size: var(--fs-11);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  display: grid;
  place-items: center;
}
.navitem.is-active .navitem__badge { background: var(--surface-3); color: var(--text); }
.navitem__badge.is-alert { background: var(--danger-soft); color: var(--danger); }

.rail__foot {
  border-top: 1px solid var(--rail-line);
  padding: 12px 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.verbox {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.verbox .ver {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 7px;
  border-radius: var(--r-xs);
  background: rgba(255, 255, 255, 0.42);
  border: 1px solid var(--rail-line);
  font-size: var(--fs-11);
  font-family: var(--mono);
  color: var(--text-3);
  white-space: nowrap;
}
.verbox .ver b { color: var(--text); font-weight: 650; }

.rolebox { position: relative; }
.rolebtn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 9px;
  border-radius: var(--r-sm);
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid var(--rail-line);
  color: var(--text);
  transition: background var(--t-fast);
}
.rolebtn:hover { background: var(--surface); }
.avatar {
  flex: none;
  width: 26px; height: 26px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  font-size: var(--fs-11);
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.02em;
}
.rolebtn__text { flex: 1; min-width: 0; text-align: left; }
.rolebtn__text b { display: block; font-size: var(--fs-12); font-weight: 600; line-height: 1.3; }
.rolebtn__text i {
  display: block;
  font-style: normal;
  font-size: var(--fs-11);
  color: var(--text-3);
  line-height: 1.35;
}
.rolebtn > svg { flex: none; opacity: 0.55; }

.rolemenu {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(100% + 6px);
  z-index: 60;
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-md);
  box-shadow: var(--sh-4);
  padding: 5px;
  display: none;
}
.rolemenu.is-open { display: block; animation: pop var(--t-fast) both; }
.rolemenu__item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 8px;
  border-radius: var(--r-sm);
  color: var(--text-2);
  text-align: left;
}
.rolemenu__item:hover { background: var(--surface-3); color: var(--text); }
.rolemenu__item.is-on { background: var(--accent-soft); color: var(--text); }
.rolemenu__item span { flex: 1; font-size: var(--fs-12); }
.rolemenu__item em {
  font-style: normal;
  font-size: var(--fs-11);
  color: var(--text-3);
}

/* ---------------- main / topbar ---------------- */

.main { display: flex; flex-direction: column; min-width: 0; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  height: var(--topbar-h);
  flex: none;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 22px;
  background: rgba(250, 250, 248, 0.97);
  border-bottom: 1px solid var(--line);
}
.topbar__title { display: flex; flex-direction: column; min-width: 0; flex: 0 1 auto; }
.topbar__title h1 {
  font-size: var(--fs-16);
  font-weight: 650;
  letter-spacing: -0.01em;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar__title p {
  font-size: var(--fs-12);
  color: var(--text-3);
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar__spacer { flex: 1; }

.content { flex: 1; min-width: 0; padding: 18px; }
.content:focus { outline: none; }

/* ---------------- buttons ---------------- */

.btn {
  --btn-h: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: var(--btn-h);
  padding: 0 12px;
  border-radius: var(--r-sm);
  font-size: var(--fs-13);
  font-weight: 550;
  letter-spacing: 0.005em;
  border: 1px solid transparent;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
  white-space: nowrap;
}
.btn svg { flex: none; }
.btn--primary { background: var(--accent); color: #fff; box-shadow: var(--sh-1); }
.btn--primary:hover { background: var(--accent-hover); }
.btn--primary:active { background: var(--accent-press); }
.btn--ink { background: var(--text); color: #fff; }
.btn--ink:hover { background: #343A3F; }
.btn--ghost { background: var(--surface); border-color: var(--line-strong); color: var(--text); }
.btn--ghost:hover { background: var(--surface-3); border-color: #B6BDC9; }
.btn--quiet { color: var(--text-2); }
.btn--quiet:hover { background: var(--surface-3); color: var(--text); }
.btn--danger { background: var(--surface); border-color: #F0C4C6; color: var(--danger); }
.btn--danger:hover { background: var(--danger-soft); }
.btn--ok { background: var(--ok); color: #fff; }
.btn--ok:hover { background: #0B8A5F; }
.btn--sm { --btn-h: 28px; padding: 0 9px; font-size: var(--fs-12); }
.btn--lg { --btn-h: 40px; padding: 0 18px; font-size: var(--fs-14); }
.btn--block { width: 100%; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }

/* ---------------- panels ---------------- */

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: none;
}
.panel__head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--line-2);
  min-height: 50px;
}
.panel__head h2, .panel__head h3 {
  font-size: var(--fs-14);
  font-weight: 650;
  letter-spacing: -0.005em;
  white-space: nowrap;
}
.panel__head .spacer { flex: 1; }
.panel__sub { font-size: var(--fs-12); color: var(--text-3); font-weight: 400; }
.panel__body { padding: 16px; }
.panel__foot {
  padding: 12px 16px;
  border-top: 1px solid var(--line-2);
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-title {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 12px;
}
.section-title h2 { font-size: var(--fs-15); font-weight: 650; letter-spacing: -0.01em; }
.section-title p { font-size: var(--fs-12); color: var(--text-3); }

/* ---------------- chips / tags ---------------- */

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 22px;
  padding: 0 8px;
  border-radius: var(--r-xs);
  font-size: var(--fs-12);
  font-weight: 550;
  background: var(--surface-3);
  color: var(--text-2);
  white-space: nowrap;
}
.chip svg { opacity: 0.7; }
.chip--soft { background: var(--accent-soft); color: var(--accent-press); }
.chip--line { background: transparent; border: 1px solid var(--line); }
.chip--mono { font-family: var(--mono); font-size: var(--fs-11); letter-spacing: -0.01em; }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 21px;
  padding: 0 7px;
  border-radius: var(--r-xs);
  background: var(--surface-3);
  color: var(--text-2);
  font-size: var(--fs-12);
}

.dot {
  width: 6px; height: 6px;
  border-radius: 99px;
  flex: none;
  background: currentColor;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 22px;
  padding: 0 8px 0 7px;
  border-radius: var(--r-xs);
  font-size: var(--fs-12);
  font-weight: 600;
  white-space: nowrap;
}
.status--doing  { background: var(--info-soft);    color: #1656AC; }
.status--done   { background: var(--ok-soft);      color: #0A7A55; }
.status--wait   { background: var(--surface-3);    color: var(--text-2); }
.status--pending{ background: var(--warn-soft);    color: #92500A; }
.status--reject { background: var(--danger-soft);  color: #A52730; }
.status--arb    { background: var(--mixed-soft);   color: #5F35B8; }

.mk {
  display: inline-flex;
  align-items: center;
  height: 21px;
  padding: 0 7px;
  border-radius: var(--r-xs);
  font-size: var(--fs-12);
  font-weight: 600;
  font-family: var(--mono);
  letter-spacing: 0.01em;
}
.mk--NEW     { background: var(--new-soft);     color: #0A7A55; }
.mk--USED    { background: var(--used-soft);    color: #92500A; }
.mk--MIXED   { background: var(--mixed-soft);   color: #5F35B8; }
.mk--UNKNOWN { background: var(--unknown-soft); color: #5A6273; }
.mk--NON_TRANSACTION { background: var(--surface-3); color: var(--text-3); }

/* ---------------- trace chip (signature motif) ---------------- */

.trace {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 26px;
  padding: 0 9px;
  border-radius: var(--r-sm);
  background: var(--surface-2);
  border: 1px solid var(--line);
  max-width: 100%;
}
.trace__raw {
  font-size: var(--fs-12);
  color: var(--text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.trace__arrow { flex: none; color: var(--text-3); opacity: 0.75; }
.trace__std {
  font-size: var(--fs-12);
  font-weight: 600;
  color: var(--accent-press);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.trace--inline { height: 22px; padding: 0 7px; gap: 5px; }

/* ---------------- tables ---------------- */

.tablewrap { overflow-x: auto; border-radius: 0 0 var(--r-lg) var(--r-lg); }

.tbl { font-size: var(--fs-13); }
.tbl th {
  text-align: left;
  font-size: var(--fs-12);
  font-weight: 600;
  color: var(--text-3);
  padding: 9px 14px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 1;
}
.tbl td {
  padding: 0 14px;
  height: var(--row-h);
  border-bottom: 1px solid var(--line-2);
  color: var(--text-2);
  vertical-align: middle;
}
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr { transition: background var(--t-fast); }
.tbl tbody tr:hover { background: #F8F9FB; }
.tbl tbody tr.is-new { animation: rowflash 2.2s ease-out both; }
.tbl .strong { color: var(--text); font-weight: 600; }
.tbl .num { font-variant-numeric: tabular-nums; }
.tbl .right { text-align: right; }
.tbl .center { text-align: center; }

@keyframes rowflash {
  0% { background: var(--accent-soft-2); }
  100% { background: transparent; }
}

/* progress */
.prog {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 132px;
}
.prog__bar {
  flex: 1;
  height: 6px;
  border-radius: 99px;
  background: var(--surface-3);
  overflow: hidden;
}
.prog__fill {
  height: 100%;
  border-radius: 99px;
  background: var(--accent);
  transition: width var(--t-mid);
}
.prog__fill.is-done { background: var(--ok); }
.prog__txt {
  flex: none;
  font-size: var(--fs-12);
  font-variant-numeric: tabular-nums;
  color: var(--text-2);
  min-width: 40px;
  text-align: right;
}

/* ---------------- filters / segmented ---------------- */

.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.seg {
  display: inline-flex;
  padding: 2px;
  gap: 2px;
  border-radius: var(--r-sm);
  background: var(--surface-3);
  border: 1px solid var(--line);
}
.seg button {
  height: 26px;
  padding: 0 11px;
  border-radius: 5px;
  font-size: var(--fs-12);
  font-weight: 550;
  color: var(--text-2);
  transition: background var(--t-fast), color var(--t-fast);
}

.qdot:hover { background: var(--line-strong); }
.qdot.is-done { background: var(--ok); }
.qdot.is-on { background: var(--accent); transform: scaleY(1.6); }

.wbgrid {
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(360px, 0.85fr);
  grid-template-areas:
    "player annotation"
    "evidence annotation";
  gap: 12px;
  align-items: start;
}

/* ---- player ---- */

.player { grid-area: player; position: static; }
.player__frame {
  position: relative;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: var(--r-md) var(--r-md) 0 0;
  background: #0B0F16;
}
.frame__svg { width: 100%; height: 100%; display: block; }
.player__tc {
  position: absolute;
  left: 10px; top: 10px;
  font-size: var(--fs-11);
  color: #E7ECF5;
  background: rgba(8, 11, 17, 0.56);
  border: 1px solid rgba(255, 255, 255, 0.12);
  padding: 2px 7px;
  border-radius: var(--r-xs);
  letter-spacing: 0.02em;
}
.player__badge {
  position: absolute;
  right: 10px; top: 10px;
  font-size: var(--fs-11);
  color: #C9D3E4;
  background: rgba(8, 11, 17, 0.5);
  padding: 2px 7px;
  border-radius: var(--r-xs);
}
.ocrbox {
  position: absolute;
  font-size: var(--fs-11);
  color: #F2F6FF;
  background: rgba(9, 13, 20, 0.66);
  border: 1px solid rgba(143, 165, 255, 0.32);
  padding: 2px 6px;
  border-radius: var(--r-xs);
  white-space: nowrap;
}
.subbar {
  position: absolute;
  left: 7%; right: 7%; bottom: 6%;
  text-align: center;
  font-size: var(--fs-13);
  line-height: 1.5;
  color: #FFFFFF;
  background: rgba(6, 9, 14, 0.62);
  border-radius: var(--r-sm);
  padding: 5px 10px;
}
.subbar .asr__hit { background: rgba(229, 91, 32, 0.34); color: #FFFFFF; }

.seek { padding: 12px 14px 4px; cursor: pointer; }
.seek__track {
  position: relative;
  height: 6px;
  border-radius: 99px;
  background: var(--surface-3);
}
.seek__fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--accent); }
.seek__head {
  position: absolute;
  top: 50%;
  width: 11px; height: 11px;
  border-radius: 99px;
  background: #fff;
  border: 2.5px solid var(--accent);
  transform: translate(-50%, -50%);
  box-shadow: 0 1px 3px rgba(16, 21, 33, 0.25);
}
.seek__kf {
  position: absolute;
  top: 50%;
  width: 3px; height: 10px;
  background: var(--text-3);
  opacity: 0.45;
  transform: translate(-50%, -50%);
  border-radius: 2px;
}

.player__ctrl {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  row-gap: 6px;
  padding: 8px 14px 12px;
}
.player__ctrl .spacer { flex: 1; }
.iconbtn {
  width: 30px; height: 30px;
  border-radius: var(--r-sm);
  display: grid;
  place-items: center;
  color: var(--text-2);
  border: 1px solid var(--line);
  background: var(--surface);
  transition: background var(--t-fast), color var(--t-fast);
}
.iconbtn:hover { background: var(--surface-3); color: var(--text); }
.iconbtn--play { background: var(--text); border-color: var(--text); color: #fff; width: 34px; height: 34px; }
.iconbtn--play:hover { background: #222A3B; color: #fff; }
.player__time { font-size: var(--fs-12); color: var(--text-2); margin-left: 2px; }
.seg--sm button { height: 24px; padding: 0 8px; font-size: var(--fs-11); }

.thumbs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  padding: 0 14px 14px;
}
.thumb {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface);
  text-align: left;
  transition: border-color var(--t-fast), background var(--t-fast);
}
.thumb:hover { border-color: var(--line-strong); }
.thumb.is-on { border-color: var(--accent); background: var(--accent-soft); }
.thumb__mini {
  display: block;
  width: 100%;
  aspect-ratio: 16 / 10;
  max-height: 84px;
  border-radius: var(--r-xs);
  overflow: hidden;
  background: #0B0F16;
}
.thumb__mini svg { width: 100%; height: 100%; }
.thumb__l { font-size: var(--fs-11); color: var(--text-2); line-height: 1.3; }
.thumb__t { font-size: 10px; color: var(--text-3); }

/* ---- evidence ---- */

.evidence-pane { grid-area: evidence; }
.annotation-pane {
  grid-area: annotation;
  position: sticky;
  top: calc(var(--topbar-h) + 12px);
  /* 不允许长标注面板滑到固定操作栏下方：超出时面板内部滚动 */
  max-height: calc(100vh - 218px);
  overflow-y: auto;
  overscroll-behavior: contain;
}
.evidence-panel .panel__body { padding: 0; }
.evidence-duration {
  font-size: var(--fs-11);
  color: var(--text-2);
  border-left: 1px solid var(--line);
  padding-left: 10px;
}
.evidence-track {
  position: relative;
  margin-left: 16px;
  border-left: 2px solid var(--line-strong);
}
.evidence-track__item {
  position: relative;
  padding: 13px 16px 13px 20px;
  border-bottom: 1px solid var(--line-2);
}
.evidence-track__item:last-child { border-bottom: 0; }
.evidence-track__item::before {
  content: "";
  position: absolute;
  left: -5px;
  top: 18px;
  width: 8px;
  height: 8px;
  background: var(--surface);
  border: 2px solid var(--accent);
  border-radius: 1px;
}

.evi__title { font-size: var(--fs-15); font-weight: 620; line-height: 1.55; letter-spacing: -0.005em; }
.evi__meta { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.evi__meta-i { display: flex; align-items: baseline; gap: 6px; font-size: var(--fs-12); }
.evi__meta-i i { font-style: normal; color: var(--text-3); }
.evi__meta-i b { font-weight: 550; color: var(--text-2); }
.evi__tags { display: flex; flex-wrap: wrap; gap: 5px; }

.evi__block { padding: 10px 12px; }
.evi__blockhead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.evi__tag {
  font-family: var(--mono);
  font-size: var(--fs-11);
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--accent-press);
  background: transparent;
  border-radius: 0;
  padding: 0;
}
.evi__text { font-size: var(--fs-13); line-height: 1.75; color: var(--text); }
.asr__hit {
  background: rgba(229, 91, 32, 0.14);
  color: var(--accent-press);
  border-radius: 3px;
  padding: 0 3px;
  font-weight: 600;
}

.aliasbox {
  border: 1px solid var(--accent-line);
  background: var(--accent-soft);
  border-radius: var(--r-md);
  padding: 11px 12px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.aliasbox__head { display: flex; align-items: center; gap: 7px; font-size: var(--fs-12); }
.aliasbox__head svg { color: var(--accent); }
.aliasbox__head b { font-weight: 650; }
.aliasbox__head span { color: var(--text-3); }

/* ---- annotation ---- */

.aststep { display: flex; flex-direction: column; gap: 8px; }
.aststep__head { display: flex; align-items: center; gap: 8px; }
.aststep__n {
  width: 19px; height: 19px;
  flex: none;
  border-radius: var(--r-xs);
  background: var(--text);
  color: #fff;
  font-size: var(--fs-11);
  font-weight: 700;
  display: grid;
  place-items: center;
  font-variant-numeric: tabular-nums;
}
.aststep__t { font-size: var(--fs-13); font-weight: 620; }
.aststep__body { padding-left: 27px; }

.optlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.optlist .radio { padding: 7px 9px; }
.optlist .radio__text { font-size: var(--fs-12); line-height: 1.45; }

.vehlist { display: flex; flex-direction: column; gap: 10px; }
.vehrow {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 10px;
  background: var(--surface-2);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.vehrow__head { display: flex; align-items: center; gap: 8px; }
.vehrow__n { font-size: var(--fs-12); font-weight: 650; color: var(--text-2); }
.vehrow__head .btn { margin-left: auto; }
.vehrow__series { padding-left: 2px; }

.picker { position: relative; }
.pickrow { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
.picker__list {
  display: none;
  max-height: 214px;
  overflow-y: auto;
  margin-top: 6px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: var(--surface);
  box-shadow: var(--sh-2);
}
.picker__list.is-open { display: block; }
.pickitem {
  width: 100%;
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 7px 10px;
  text-align: left;
  border-bottom: 1px solid var(--line-2);
  transition: background var(--t-fast);
}
.pickitem:last-child { border-bottom: 0; }
.pickitem:hover { background: var(--accent-soft); }
.pickitem.is-on { background: var(--accent-soft); }
.pickitem__cn { font-size: var(--fs-13); font-weight: 550; }
.pickitem__en { font-size: var(--fs-12); color: var(--text-3); }
.pickitem__id { margin-left: auto; font-size: var(--fs-11); color: var(--text-3); }
.picker__empty {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 10px;
  font-size: var(--fs-12);
  color: var(--text-3);
  flex-wrap: wrap;
}
.picker__empty svg { color: var(--line-strong); }
.picker__empty > div { display: flex; flex-direction: column; }
.picker__empty b { font-size: var(--fs-12); color: var(--text-2); }

.hintlist { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.hint {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 9px;
  border-radius: var(--r-sm);
  border: 1px solid var(--accent-line);
  background: var(--accent-soft);
  text-align: left;
  transition: background var(--t-fast);
}
.hint:hover { background: var(--accent-soft-2); }
.hint__raw { font-size: var(--fs-12); color: var(--text-2); }
.hint svg { color: var(--accent); opacity: 0.6; }
.hint__std { font-size: var(--fs-12); font-weight: 620; color: var(--accent-press); }
.hint__src { margin-left: auto; font-size: var(--fs-11); color: var(--text-3); }

.serieslist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
.serieslist.is-empty { grid-template-columns: 1fr; gap: 8px; }
.seriesitem {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  background: var(--surface);
  text-align: left;
  transition: border-color var(--t-fast), background var(--t-fast);
}
.seriesitem:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.seriesitem.is-on { border-color: var(--accent); background: var(--accent-soft); }
.seriesitem__n { font-size: var(--fs-12); font-weight: 550; }
.seriesitem__id { margin-left: auto; font-size: 10px; color: var(--text-3); }
.seriesitem.is-on .seriesitem__id { color: var(--accent-press); }

.gapbtn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 8px;
  padding: 7px;
  border-radius: var(--r-sm);
  border: 1px dashed var(--accent-line);
  background: var(--accent-soft);
  color: var(--accent-press);
  font-size: var(--fs-12);
  font-weight: 600;
  width: 100%;
  transition: background var(--t-fast);
}
.gapbtn:hover { background: var(--accent-soft-2); }

.errors {
  display: flex;
  gap: 10px;
  padding: 11px 13px;
  border-radius: var(--r-md);
  background: var(--danger-soft);
  border: 1px solid #F3C9CB;
  color: #8F242B;
  font-size: var(--fs-12);
}
.errors svg { flex: none; margin-top: 1px; }
.errors b { font-weight: 650; }
.errors ul { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.errors li::before { content: "· "; }

.wbfoot {
  position: sticky;
  bottom: 14px;
  z-index: 15;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: rgba(250, 250, 248, 0.97);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: 0 -1px 0 rgba(36, 40, 45, 0.06);
}

/* ---- rules drawer ---- */

.rulelist { display: flex; flex-direction: column; gap: 14px; }
.rulelist li { display: flex; gap: 11px; }
.rulelist__n {
  flex: none;
  width: 34px;
  font-size: var(--fs-11);
  font-weight: 700;
  color: var(--accent-press);
  background: var(--accent-soft);
  border-radius: var(--r-xs);
  padding: 2px 0;
  text-align: center;
  height: 19px;
}
.rulelist b { font-size: var(--fs-13); font-weight: 620; }
.rulelist p { font-size: var(--fs-12); color: var(--text-2); line-height: 1.65; margin-top: 2px; }

/* ============================================================
   质检 / 仲裁
   ============================================================ */

.splitpane {
  display: grid;
  grid-template-columns: 296px minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}
.splitpane__main { min-width: 0; }
.queuelist { position: sticky; top: calc(var(--topbar-h) + 22px); max-height: calc(100vh - 120px); display: flex; flex-direction: column; }
.qlist { overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 3px; }
.qitem {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 9px 10px;
  border-radius: var(--r-sm);
  border: 1px solid transparent;
  text-align: left;
  transition: background var(--t-fast), border-color var(--t-fast);
}
.qitem:hover { background: var(--surface-2); }
.qitem.is-on { background: var(--accent-soft); border-color: var(--accent-line); }
.qitem.is-on { box-shadow: inset 3px 0 0 var(--accent); }
.qitem__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.qitem__t {
  font-size: var(--fs-12);
  font-weight: 550;
  color: var(--text);
  line-height: 1.45;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.qitem__m { font-size: var(--fs-11); color: var(--text-3); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

.qcdetail { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 16px; align-items: start; }
.qcframe {
  position: relative;
  aspect-ratio: 16 / 9;
  border-radius: var(--r-md);
  overflow: hidden;
  background: #0B0F16;
}
.qcframe svg { width: 100%; height: 100%; display: block; }

.kvlist { display: flex; flex-direction: column; gap: 7px; }
.kvlist__i { display: flex; align-items: baseline; gap: 12px; font-size: var(--fs-12); }
.kvlist__i span { flex: none; width: 74px; color: var(--text-3); }
.kvlist__i b { font-weight: 600; }

.cmp { display: flex; flex-direction: column; }
.cmp li {
  display: grid;
  grid-template-columns: 66px minmax(0, 1fr) 20px minmax(0, 1fr);
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px dashed var(--line-2);
  font-size: var(--fs-12);
}
.cmp li:last-child { border-bottom: 0; }
.cmp__k { color: var(--text-3); }
.cmp__mine { color: var(--text-2); }
.cmp__arrow { display: grid; place-items: center; color: var(--text-3); }
.cmp__std { font-weight: 600; }
.cmp li.is-same .cmp__std { color: var(--ok); }
.cmp li.is-diff .cmp__std { color: var(--danger); }
.cmp li.is-diff .cmp__mine { color: var(--danger); text-decoration: line-through; opacity: 0.8; }
.cmp li.is-diff .cmp__arrow { color: var(--danger); }

.reasons { display: flex; flex-wrap: wrap; gap: 6px; }
.reason {
  height: 28px;
  padding: 0 11px;
  border-radius: var(--r-sm);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  font-size: var(--fs-12);
  color: var(--text-2);
  transition: border-color var(--t-fast), color var(--t-fast), background var(--t-fast);
}
.reason:hover { border-color: var(--danger); color: var(--danger); }
.reason.is-on { background: var(--danger-soft); border-color: var(--danger); color: #A52730; font-weight: 600; }

.claims { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.claim {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  text-align: left;
  transition: border-color var(--t-fast), background var(--t-fast);
}
.claim:hover { border-color: var(--accent-line); background: var(--surface-2); }
.claim.is-on { border-color: var(--accent); background: var(--accent-soft); }
.claim.is-locked { cursor: default; }
.claim__head { display: flex; align-items: center; gap: 8px; }
.claim__avatar {
  width: 24px; height: 24px;
  flex: none;
  border-radius: 7px;
  display: grid;
  place-items: center;
  color: #fff;
  font-size: var(--fs-11);
  font-weight: 700;
}
.claim__role { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.claim__role { font-size: var(--fs-12); font-weight: 620; }
.claim__role i { font-style: normal; font-size: var(--fs-11); color: var(--text-3); font-weight: 400; }
.claim__pick { color: var(--accent); }
.claim__val { font-family: var(--mono); font-size: var(--fs-14); font-weight: 650; }
.claim__ent { font-size: var(--fs-12); color: var(--text-2); }

/* ============================================================
   缺口提报 / 标准库
   ============================================================ */

.typecard {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  padding: 12px 13px;
  box-shadow: none;
  display: flex;
  flex-direction: column;
  gap: 5px;
  text-align: left;
}
.typecard__top { display: flex; align-items: center; gap: 8px; }
.typecard__top b { flex: 1; font-size: var(--fs-13); font-weight: 650; }
.typecard__top span { font-size: var(--fs-16); font-weight: 660; color: var(--text-3); font-variant-numeric: tabular-nums; }
.typecard__top svg { color: var(--accent); }
.typecard p { font-size: var(--fs-12); color: var(--text-3); line-height: 1.55; }

.typecards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.typecard--pick { cursor: pointer; transition: border-color var(--t-fast), background var(--t-fast); }
.typecard--pick:hover { border-color: var(--accent-line); }
.typecard--pick.is-on { border-color: var(--accent); background: var(--accent-soft); }

.flowcol { display: flex; flex-direction: column; gap: 0; }
.flowcol__i { position: relative; padding-bottom: 16px; color: var(--text-3); }
.flowcol__i:last-child { padding-bottom: 0; }
.flowcol__a {
  position: absolute;
  left: 10px;
  top: 24px;
  bottom: 4px;
  width: 1px;
  background: var(--line-strong);
}

.vercard { display: flex; flex-direction: column; gap: 6px; }
.verbar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 16px;
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  box-shadow: none;
  flex-wrap: wrap;
}
.verbar__i { display: flex; align-items: baseline; gap: 6px; font-size: var(--fs-12); }
.verbar__i i { font-style: normal; color: var(--text-3); }
.verbar__i b { font-weight: 620; }

.tabs { display: flex; align-items: center; gap: 2px; }
.tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 11px;
  border-radius: var(--r-sm);
  font-size: var(--fs-13);
  font-weight: 550;
  color: var(--text-2);
  transition: background var(--t-fast), color var(--t-fast);
}
.tab:hover { background: var(--surface-3); color: var(--text); }
.tab.is-on { background: var(--accent-soft); color: var(--accent-press); font-weight: 620; }
.tab__n {
  font-size: var(--fs-11);
  color: var(--text-3);
  background: var(--surface-3);
  border-radius: var(--r-xs);
  padding: 0 5px;
  min-width: 18px;
  text-align: center;
}
.tab.is-on .tab__n { background: rgba(47, 79, 224, 0.14); color: var(--accent-press); }

.codeblock {
  margin: 0;
  padding: 14px;
  border-radius: var(--r-md);
  background: #0E1420;
  color: #C8D4E8;
  font-size: var(--fs-12);
  line-height: 1.65;
  overflow-x: auto;
  max-height: 340px;
}

/* ============================================================
   Responsive
   ============================================================ */

@media (max-width: 1180px) {
  .grid-main-side { grid-template-columns: minmax(0, 1fr); }
  .sticky { position: static; }
  .splitpane { grid-template-columns: minmax(0, 1fr); }
  .queuelist { position: static; max-height: none; }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 980px) {
  :root { --rail-w: 68px; }
  .rail__brand-text, .navitem__label, .rolebtn__text, .verbox { display: none; }
  .rail { align-items: stretch; }
  .rail__brand { justify-content: center; padding: 16px 0; }
  .navitem { justify-content: center; padding: 9px 0; }
  .navitem__badge { position: absolute; top: 4px; right: 8px; }
  .navitem { position: relative; }
  .rolebtn { justify-content: center; }
  .rolebtn > svg { display: none; }
  .syncchip { display: none; }
  .formgrid, .formgrid--3, .fieldgrid { grid-template-columns: minmax(0, 1fr); }
  .claims, .serieslist { grid-template-columns: minmax(0, 1fr); }
  .qcdetail { grid-template-columns: minmax(0, 1fr); }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .content { padding: 16px; }
}

@media (max-width: 640px) {
  .grid-4, .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); }
  .typecards { grid-template-columns: minmax(0, 1fr); }
  .thumbs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wbfoot { flex-wrap: wrap; }
}

/* Inspection-workbench responsive composition. */
@media (max-width: 1365px) and (min-width: 821px) {
  .wbgrid {
    grid-template-columns: minmax(0, 1.45fr) minmax(350px, 0.8fr);
    grid-template-areas:
      "player annotation"
      "evidence annotation";
  }
  .player { display: block; }
  .player__frame, .seek, .player__ctrl, .thumbs { grid-column: auto; grid-row: auto; }
  .player__frame { border-radius: var(--r-md) var(--r-md) 0 0; }
}

/* 标注列在 1366px 以下不足 420px，选项列表必须单列，否则 NON_TRANSACTION 会溢出或断词 */
@media (max-width: 1365px) {
  .optlist { grid-template-columns: minmax(0, 1fr); }
}

/* 宽屏播放区：视频与播放控件 / 关键帧并排，把证据轨道拉回首屏。 */
@media (min-width: 1366px) {
  .player {
    display: grid;
    grid-template-columns: minmax(0, 2.2fr) minmax(200px, 1fr);
    grid-template-rows: auto auto 1fr;
    column-gap: 14px;
  }
  .player__frame {
    grid-column: 1;
    grid-row: 1 / -1;
    /* 宽度必须由列宽决定：只设 height 会让 16:9 反推宽度并溢出到控件列 */
    width: 100%;
    height: 100%;
    border-radius: var(--r-md) 0 0 var(--r-md);
  }
  .seek { grid-column: 2; grid-row: 1; align-self: end; }
  .player__ctrl { grid-column: 2; grid-row: 2; flex-wrap: wrap; }
  .thumbs {
    grid-column: 2;
    grid-row: 3;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    padding: 8px 14px 14px 0;
    align-self: start;
  }
}

@media (max-width: 1100px) and (min-width: 981px) {
  :root { --rail-w: 68px; }
  .rail__brand-text, .navitem__label, .rolebtn__text, .verbox { display: none; }
  .rail__brand { justify-content: center; padding: 16px 0; }
  .navitem { position: relative; justify-content: center; padding: 9px 0; }
  .navitem__badge { position: absolute; top: 4px; right: 8px; }
  .rolebtn { justify-content: center; }
  .rolebtn > svg { display: none; }
}

@media (max-width: 820px) {
  .wbgrid {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "player" "evidence" "annotation";
  }
  .player { display: block; }
  .player__frame, .seek, .player__ctrl, .thumbs { grid-column: auto; grid-row: auto; }
  .annotation-pane { position: static; max-height: none; overflow-y: visible; }
  .wbhead { align-items: flex-start; flex-wrap: wrap; row-gap: 8px; }
  .wbhead__l { flex-wrap: wrap; row-gap: 8px; }
  .wbhead__p { width: auto; flex: 1 1 150px; min-width: 0; }
  .prog--wide { min-width: 0; }
  .wbhead__q { width: 100%; order: 3; justify-content: space-between; }
}
</style>

<script>
/* Shared render + interaction primitives. */
(function () {
  var ico = window.Ico.icon;

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function num(n) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  function pct(a, b) { return b ? Math.round((a / b) * 1000) / 10 : 0; }

  /* ------------- toasts ------------- */
  var toastRoot = null;
  function toast(msg, kind, ms) {
    toastRoot = toastRoot || document.getElementById("toast-root");
    if (!toastRoot) return;
    var map = { ok: "checkCircle", warn: "gap", info: "info" };
    var k = kind || "ok";
    var node = document.createElement("div");
    node.className = "toast toast--" + k;
    node.innerHTML = ico(map[k] || "info", 17) + "<span>" + esc(msg) + "</span>";
    toastRoot.appendChild(node);
    setTimeout(function () {
      node.style.transition = "opacity 200ms, transform 200ms";
      node.style.opacity = "0";
      node.style.transform = "translateY(6px)";
      setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 220);
    }, ms || 2600);
  }

  /* ------------- overlays ------------- */
  var overlayRoot = null;
  function openOverlay(html, opts) {
    overlayRoot = overlayRoot || document.getElementById("overlay-root");
    opts = opts || {};
    var scrim = document.createElement("div");
    scrim.className = "scrim" + (opts.drawer ? " scrim--drawer" : "");
    scrim.innerHTML = html;
    scrim.setAttribute("role", "dialog");
    scrim.setAttribute("aria-modal", "true");
    overlayRoot.appendChild(scrim);

    function close(e) {
      if (e && e.type === "click" && e.target !== scrim) return;
      document.removeEventListener("keydown", onKey);
      scrim.remove();
      if (opts.onClose) opts.onClose();
    }
    function onKey(e) { if (e.key === "Escape") close(); }

    scrim.addEventListener("mousedown", function (e) { if (e.target === scrim) close(); });
    scrim.querySelectorAll("[data-close]").forEach(function (b) {
      b.addEventListener("click", function () { close(); });
    });
    document.addEventListener("keydown", onKey);
    var focusable = scrim.querySelector("[autofocus], .modal__close, button, input, select, textarea");
    if (focusable) focusable.focus({ preventScroll: true });
    return scrim;
  }

  function modal(o) {
    var head = '<div class="modal__head"><div><h2>' + esc(o.title) + "</h2>" +
      (o.sub ? "<p>" + esc(o.sub) + "</p>" : "") + "</div><div class=\"spacer\"></div>" +
      '<button class="modal__close" data-close aria-label="关闭">' + ico("close", 17) + "</button></div>";
    var foot = o.foot ? '<div class="modal__foot">' + o.foot + "</div>" : "";
    return openOverlay(
      '<div class="modal ' + (o.size ? "modal--" + o.size : "") + '" role="document">' +
      head + '<div class="modal__body">' + o.body + "</div>" + foot + "</div>",
      { onClose: o.onClose }
    );
  }

  function drawer(o) {
    var head = '<div class="modal__head"><div><h2>' + esc(o.title) + "</h2>" +
      (o.sub ? "<p>" + esc(o.sub) + "</p>" : "") + "</div><div class=\"spacer\"></div>" +
      '<button class="modal__close" data-close aria-label="关闭">' + ico("close", 17) + "</button></div>";
    return openOverlay(
      '<aside class="drawer">' + head + '<div class="modal__body">' + o.body + "</div>" +
      (o.foot ? '<div class="modal__foot">' + o.foot + "</div>" : "") + "</aside>",
      { drawer: true, onClose: o.onClose }
    );
  }

  function confirm(o) {
    var scrim = modal({
      size: "narrow",
      title: o.title,
      sub: o.sub,
      body: '<p style="font-size:13px;line-height:1.7;color:var(--text-2)">' + (o.body || "") + "</p>",
      foot: '<div class="spacer"></div><button class="btn btn--ghost" data-close>取消</button>' +
        '<button class="btn ' + (o.danger ? "btn--danger" : "btn--primary") + '" data-yes>' + esc(o.yes || "确认") + "</button>"
    });
    scrim.querySelector("[data-yes]").addEventListener("click", function () {
      scrim.remove();
      if (o.onYes) o.onYes();
    });
    return scrim;
  }

  /* ------------- small parts ------------- */

  function progress(done, total, opts) {
    opts = opts || {};
    var p = pct(done, total);
    return '<div class="prog"><div class="prog__bar"><div class="prog__fill' +
      (p >= 100 ? " is-done" : "") + '" style="width:' + Math.min(100, p) + '%"></div></div>' +
      (opts.hideText ? "" : '<span class="prog__txt">' + p.toFixed(p % 1 ? 1 : 0) + "%</span>") + "</div>";
  }

  function status(text, cls) {
    return '<span class="status ' + cls + '"><span class="dot"></span>' + esc(text) + "</span>";
  }

  function mark(m) {
    var label = DB.marketLabel[m] || m;
    return '<span class="mk mk--' + esc(m) + '">' + esc(m) + " · " + esc(label) + "</span>";
  }

  function trace(raw, std) {
    return '<span class="trace"><span class="trace__raw">' + esc(raw) + "</span>" +
      '<span class="trace__arrow">' + ico("arrowRight", 13) + "</span>" +
      '<span class="trace__std">' + esc(std) + "</span></span>";
  }

  function field(o) {
    return '<label class="field"><span class="field__label">' + esc(o.label) +

  function kpi(m) {
    return '<div class="kpi' + (m.key === "gap" ? " kpi--accent" : "") + '">' +
      '<span class="kpi__label">' + esc(m.label) + (m.key === "gap" ? " " + ico("flag", 12) : "") + "</span>" +
      '<span class="kpi__value num">' + esc(m.value) + "<small>" + esc(m.unit) + "</small></span>" +
      '<span class="kpi__foot"><span class="' + (m.up ? "up" : "down") + '">' + esc(m.delta) + "</span>" +
      esc(m.note) + "</span></div>";
  }

  /* ------------- charts ------------- */

  function bars(data, opt) {
    opt = opt || {};
    var max = Math.max.apply(null, data.map(function (d) { return d.v; }));
    var h = opt.h || 108;
    var w = 100 / data.length;
    var out = '<div class="bars" style="height:' + h + 'px">';
    data.forEach(function (d) {
      var hp = Math.max(3, Math.round((d.v / max) * (h - 20)));
      out += '<div class="bars__col" style="width:' + w + '%">' +
        '<span class="bars__v num">' + num(d.v) + "</span>" +
        '<span class="bars__b' + (opt.accentLast === data.indexOf(d) ? " is-hi" : "") +
        '" style="height:' + hp + 'px"></span>' +
        '<span class="bars__l">' + esc(d.d) + "</span></div>";
    });
    return out + "</div>";
  }

  function hbars(data) {
    var max = Math.max.apply(null, data.map(function (d) { return d.v; }));
    return '<ul class="hbars">' + data.map(function (d) {
      return '<li><span class="hbars__l">' + esc(d.label) + "</span>" +
        '<span class="hbars__t"><i style="width:' + Math.round((d.v / max) * 100) + '%"></i></span>' +
        '<span class="hbars__v num">' + d.v + "%</span></li>";
    }).join("") + "</ul>";
  }

  /* ------------- video frame (stylised stand-in for source media) ------------- */

  function carFrame(cfg) {
    cfg = cfg || {};
    var body = cfg.body || "#E9EDF2";
    var accent = cfg.accent || "#2F4FE0";

      '<svg class="frame__svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="视频画面示意">' +
      "<defs>" +
      '<linearGradient id="bg' + uid + '" x1="0" y1="0" x2="0.4" y2="1">' +
      '<stop offset="0%" stop-color="#1B2230"/><stop offset="55%" stop-color="#111722"/><stop offset="100%" stop-color="#0A0E15"/>' +
      "</linearGradient>" +
      '<linearGradient id="bd' + uid + '" x1="0.1" y1="0" x2="0.6" y2="1">' +
      '<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>' +
      '<stop offset="42%" stop-color="' + body + '"/>' +
      '<stop offset="100%" stop-color="#8F97A3"/>' +
      "</linearGradient>" +
      '<linearGradient id="gl' + uid + '" x1="0" y1="0" x2="0.6" y2="1">' +
      '<stop offset="0%" stop-color="#8FA6C4" stop-opacity="0.55"/>' +
      '<stop offset="100%" stop-color="#5A6B82" stop-opacity="0.35"/>' +
      "</linearGradient>" +
      '<radialGradient id="hg' + uid + '" cx="0.5" cy="0.5" r="0.5">' +
      '<stop offset="0%" stop-color="' + accent + '" stop-opacity="0.30"/>' +
      '<stop offset="100%" stop-color="' + accent + '" stop-opacity="0"/>' +
      "</radialGradient>" +
      "</defs>" +
      '<rect width="640" height="360" fill="url(#bg' + uid + ')"/>' +
      '<ellipse cx="330" cy="250" rx="300" ry="128" fill="url(#hg' + uid + ')"/>' +
      '<rect y="302" width="640" height="58" fill="#080B11"/>' +
      '<rect y="300" width="640" height="3" fill="#1E2634"/>' +
      /* car */
      '<g opacity="0.99">' +
      '<ellipse cx="322" cy="336" rx="252" ry="15" fill="#05070B" opacity="0.85"/>' +
      '<path d="M96 300 L86 276 C84 261 94 251 110 248 L152 242 C172 210 200 192 240 186 L332 185 C374 187 400 203 418 224 L480 232 C512 236 528 252 532 274 L536 292 C537 297 533 300 527 300 L490 300 A40 40 0 0 0 410 300 L206 300 A40 40 0 0 0 126 300 Z" fill="url(#bd' + uid + ')"/>' +
      '<path d="M96 300 L86 276 C84 261 94 251 110 248 L152 242 C172 210 200 192 240 186 L332 185 C374 187 400 203 418 224 L480 232 C512 236 528 252 532 274 L536 292 C537 297 533 300 527 300 L490 300 A40 40 0 0 0 410 300 L206 300 A40 40 0 0 0 126 300 Z" fill="none" stroke="#6E7686" stroke-width="1.4"/>' +
      /* glass */
      '<path d="M162 238 L198 202 C212 194 228 190 246 190 L296 190 L296 236 Z" fill="url(#gl' + uid + ')"/>' +
      '<path d="M312 190 L358 190 C378 192 392 200 402 214 L418 236 L312 236 Z" fill="url(#gl' + uid + ')"/>' +
      /* seams + details */
      '<path d="M304 188 L304 298" stroke="#7C8593" stroke-width="1.1" opacity="0.6"/>' +
      '<path d="M336 246 L392 246" stroke="#6E7686" stroke-width="3" stroke-linecap="round" opacity="0.85"/>' +
      '<path d="M214 246 L262 246" stroke="#6E7686" stroke-width="3" stroke-linecap="round" opacity="0.85"/>' +
      '<path d="M88 252 L114 249 L117 263 L90 266 Z" fill="#F3F6FA" opacity="0.92"/>' +
      '<path d="M520 268 L536 274 L537 290 L521 287 Z" fill="#E0524F" opacity="0.9"/>' +
      '<path d="M108 272 C240 282 420 282 528 272" stroke="#5B6470" stroke-width="1.2" fill="none" opacity="0.5"/>' +
      /* wheels */
      '<g><circle cx="166" cy="298" r="34" fill="#0D1016"/><circle cx="166" cy="298" r="19" fill="#2A303A"/>' +
      '<circle cx="166" cy="298" r="6.5" fill="#9AA3B0"/>' +

      '<g><circle cx="450" cy="298" r="34" fill="#0D1016"/><circle cx="450" cy="298" r="19" fill="#2A303A"/>' +

    );

  /* ------------- export ------------- */

  function download(filename, text) {
    var blob = new Blob([text], { type: "application/json;charset=utf-8" });

    qc: DB.qcQueue.map(function (q) { return Object.assign({}, q); }),
    arb: DB.arbQueue.map(function (a) { return Object.assign({}, a); }),
    aliases: DB.aliases.map(function (a) { return Object.assign({}, a); }),
    activity: [],
    exportCount: 0
  };

  /* 已领取进度：128 / 500，与 PRD 的进度示例保持一致 */
  S.progressDone = 128;
  S.progressTotal = 500;

  function emit() { listeners.forEach(function (fn) { fn(S); }); }
  function subscribe(fn) { listeners.push(fn); }

  function log(what, from, to) {
    var role = DB.roles.filter(function (r) { return r.id === S.role; })[0];
    S.activity.unshift({
      at: nowStamp(), who: role ? role.who : S.role, what: what,
      from: from == null ? "—" : from, to: to == null ? "—" : to
    });
    if (S.activity.length > 60) S.activity.pop();
  }

  function setRole(id) {
    S.role = id;
    var home = { annotator: "workbench", qcer: "quality", arbiter: "arbitration", admin: "overview" };
    S.route = home[id] || "overview";
    emit();
  }

  function go(route) {
    if (S.route === route) return;
    S.route = route;
    emit();
  }

  /* ---------------- workbench ---------------- */

  function currentSample() { return S.samples[S.wb.index] || null; }

  function formOf(sample) {
    if (!sample) return blankForm();
    if (!S.wb.forms[sample.id]) {
      S.wb.forms[sample.id] = blankForm();
      if (sample.expect && sample.expect.multi) {
        S.wb.forms[sample.id].vehicles = [{ brandId: null, seriesId: null }, { brandId: null, seriesId: null }, { brandId: null, seriesId: null }];
      }
    }
    return S.wb.forms[sample.id];
  }

  function patch(p) {
    var s = currentSample();
    if (!s) return;
    var f = formOf(s);
    Object.keys(p).forEach(function (k) { f[k] = p[k]; });
    S.wb.savedAt = nowStamp();
    emit();
  }

  function patchVehicle(i, p) {
    var s = currentSample();
    if (!s) return;
    var f = formOf(s);
    f.vehicles[i] = Object.assign({}, f.vehicles[i], p);
    S.wb.savedAt = nowStamp();
    emit();
  }

  function setMulti(on) {
    var s = currentSample();
    if (!s) return;
    var f = formOf(s);
    f.multi = on;
    if (on && f.vehicles.length < 2) {
      f.vehicles.push({ brandId: null, seriesId: null }, { brandId: null, seriesId: null });
    }
    if (!on) {
      f.vehicles = [f.vehicles[0] || { brandId: null, seriesId: null }];
      if (f.primary !== "UNKNOWN") f.primary = f.vehicles[0].seriesId || null;
    }
    S.wb.savedAt = nowStamp();
    emit();
  }

  function addVehicle() {
    var f = formOf(currentSample());
    if (f.vehicles.length >= 5) return;
    f.vehicles.push({ brandId: null, seriesId: null });
    S.wb.savedAt = nowStamp();
    emit();
  }

  function removeVehicle(i) {
    var f = formOf(currentSample());
    if (f.vehicles.length <= 2) return;
    f.vehicles.splice(i, 1);
    S.wb.savedAt = nowStamp();
    emit();
  }

  function validate(s, f) {
    var errs = [];
    if (!f.transaction) errs.push("是否属于汽车交易内容");
    if (f.transaction === "no") return errs;
    if (!f.market) errs.push("市场类型");
    var filled = f.vehicles.filter(function (v) { return v.brandId; });
    if (!filled.length) errs.push("品牌");
    f.vehicles.forEach(function (v, i) {
      if (v.brandId && !v.seriesId) errs.push("第 " + (i + 1) + " 辆车的车系");
    });
    if (f.multi && filled.length < 2) errs.push("多车内容至少需要 2 辆车");
    if (f.multi && !f.primary) errs.push("主车");
    return errs;
  }

  /* 与标准答案比对，用于提交后的即时一致性反馈 */
  function compare(s, f) {
    var e = s && s.expect;
    if (!e) return { same: true, diffs: [] };
    var diffs = [];
    if (e.transaction !== f.transaction) diffs.push("交易内容");
    if (e.market !== f.market) diffs.push("市场类型");
    if (e.multi !== f.multi) diffs.push("多车标记");
    var wantSeries = e.series ? [e.series] : [];
    var gotSeries = f.vehicles.map(function (v) { return v.seriesId; }).filter(Boolean);
    if (wantSeries.length && gotSeries.indexOf(wantSeries[0]) === -1) diffs.push("车系");
    if (wantSeries.length && gotSeries.length > wantSeries.length) diffs.push("多标车系");
    return { same: diffs.length === 0, diffs: diffs };
  }

  function submit() {
    var s = currentSample();
    var f = formOf(s);
    var errs = validate(s, f);
    if (errs.length) return { ok: false, errs: errs };
    var cmp = compare(s, f);
    S.wb.submitted[s.id] = { form: JSON.parse(JSON.stringify(f)), same: cmp.same, diffs: cmp.diffs };
    S.wb.history.unshift({ id: s.id, at: nowStamp(), same: cmp.same, market: f.market });
    log("提交标注", s.id, (f.market || "—") + " / " + ((f.vehicles[0] && DB.brandLabel(f.vehicles[0].brandId)) || "—"));
    S.progressDone = Math.min(S.progressTotal, S.progressDone + 1);
    var last = S.wb.index >= S.samples.length - 1;
    if (!last) S.wb.index += 1;
    emit();
    return { ok: true, cmp: cmp, done: last };
  }

  function step(delta) {
    var next = S.wb.index + delta;
    if (next < 0 || next > S.samples.length - 1) return;
    S.wb.index = next;
    emit();
  }

  function jump(i) {
    if (i < 0 || i > S.samples.length - 1) return;
    S.wb.index = i;
    emit();
  }

  function saveDraft() {
    var s = currentSample();
    S.wb.savedAt = nowStamp();
    log("保存草稿", s ? s.id : "—", "草稿");
    emit();
  }

  /* ---------------- gaps ---------------- */

  function addGap(g) {
    var id = "GAP_" + (20900 + S.gaps.length);
    var item = Object.assign({
      id: id, status: "待审核", reviewer: "—", ver: "—",
      by: (DB.roles.filter(function (r) { return r.id === S.role; })[0] || {}).who || "annotator_001",
      at: new Date().toISOString().slice(0, 16).replace("T", " ")
    }, g);
    S.gaps.unshift(item);
    if (g.type === "新别名") {
      S.aliases.unshift({
        id: "AL_" + (9300 + S.aliases.length), alias: g.raw, type: "series",
        target: g.suggestId || "—", source: g.source, status: "待审核",
        by: item.by, at: item.at.slice(0, 10), ver: "—", hits: 1
      });
    }
    log("发起标准缺口提报", g.raw, g.suggest);
    emit();
    return item;
  }

  function decideGap(id, status, ver) {
    S.gaps.forEach(function (g) {
      if (g.id !== id) return;
      log("标准缺口审核", g.raw + " · " + g.status, status);
      g.status = status;
      g.reviewer = (DB.roles.filter(function (r) { return r.id === S.role; })[0] || {}).who || "王敏";
      if (ver) g.ver = ver;
    });
    if (ver) {
      S.aliases.forEach(function (a) {
        var g = S.gaps.filter(function (x) { return x.id === id; })[0];
        if (g && a.alias.toLowerCase() === g.raw.toLowerCase()) { a.status = "已入库"; a.ver = ver; }
      });
    }
    emit();
  }

  /* ---------------- qc ---------------- */

  function qcDecide(id, action, reason) {
    S.qc.forEach(function (q) {
      if (q.id !== id) return;
      if (action === "pass") { q.status = "质检通过"; log("质检通过", q.contentId, "—", "通过"); }
      if (action === "reject") {
        q.status = "已驳回"; q.reasons = [reason];
        log("质检驳回", q.contentId, "待质检", reason);
      }
      if (action === "arb") {
        q.status = "转仲裁";
        S.arb.unshift({
          id: "ARB_" + (7900 + S.arb.length), contentId: q.contentId, task: q.task,
          open: q.at, title: q.title, asr: q.asr,
          reason: "质检员提交仲裁：" + (reason || "标注结果与标准库预期不一致"),
          claims: [
            { role: "标注员", who: q.by.split(" · ")[0], tone: "#2F4FE0", val: q.result.market, brand: q.result.brand, series: q.result.series },
            { role: "标准库预期", who: "标准库 " + DB.versions.taxonomy, tone: "#0E9F6E", val: q.standard.market, brand: q.standard.brand, series: q.standard.series || "UNKNOWN" }
          ]
        });
        log("提交仲裁", q.contentId, "待质检", "转仲裁");
      }
    });
    emit();
  }

  function qcBulkPass(ids) {
    ids.forEach(function (id) { qcDecide(id, "pass"); });
  }

  /* ---------------- arbitration ---------------- */

  function arbDecide(id, claimIdx, note) {
    S.arb.forEach(function (a) {
      if (a.id !== id) return;
      var c = a.claims[claimIdx];
      a.status = "已仲裁";
      a.final = c ? (c.brand + " / " + c.series) : "UNKNOWN";
      log("仲裁最终判定", a.contentId, "争议中", a.final);
    });
    emit();
  }

  /* ---------------- export ---------------- */

  function exportPayload() {
    return S.samples.map(function (s) {
      var f = S.wb.forms[s.id];
      var submitted = S.wb.submitted[s.id];
      if (!submitted) return null;
      var b = f.vehicles[0] || {};
      return {
        content_id: s.id,
        transaction_content: f.transaction === "yes",
        market_type: f.market,
        multi_vehicle: f.multi,
        conflict_flag: !!f.conflict,
        vehicles: f.vehicles.filter(function (v) { return v.brandId; }).map(function (v, i) {
          return { brand_id: v.brandId, series_id: v.seriesId || "PENDING", primary: f.multi ? f.primary === v.seriesId : i === 0 };
        }),
        primary_vehicle: f.multi ? (f.primary || "UNKNOWN") : (b.seriesId || null),
        annotation_status: submitted.same ? "FINAL" : "REVIEW",
        taxonomy_version: DB.versions.taxonomy,
        alias_version: DB.versions.alias,
        rule_version: DB.versions.rule
      };
    }).filter(Boolean);
  }

  window.Store = {
    get state() { return S; },
    subscribe: subscribe,
    setRole: setRole, go: go,
    currentSample: currentSample, formOf: formOf, patch: patch, patchVehicle: patchVehicle,
    setMulti: setMulti, addVehicle: addVehicle, removeVehicle: removeVehicle,
    validate: validate, compare: compare, submit: submit, step: step, jump: jump, saveDraft: saveDraft,
    addGap: addGap, decideGap: decideGap,
    qcDecide: qcDecide, qcBulkPass: qcBulkPass, arbDecide: arbDecide,
    exportPayload: exportPayload, log: log
  };
})();
</script>

      '<td class="muted">' + UI.esc(t.owner) + "</td>" +
      '<td class="muted num">' + UI.esc(t.due) + "</td>" +
      "<td>" + UI.status(st, statusCls(t.status)) + "</td>" +
      "<td>" + actionsFor(t, role) + "</td></tr>";
  }

  function render() {
    var S = Store.state;
    var role = S.role;
    var list = S.tasks.filter(function (t) {
      if (filter === "all") return true;
      if (filter === "doing") return t.status === "进行中" || t.status === "待仲裁清理";
      if (filter === "open") return t.status === "待领取";
      return t.status === "已完成";
    });

    var totalSamples = S.tasks.reduce(function (a, t) { return a + t.total; }, 0);
    var totalDone = S.tasks.reduce(function (a, t) { return a + t.done; }, 0);
    var totalQc = S.tasks.reduce(function (a, t) { return a + t.qc; }, 0);
    var totalArb = S.tasks.reduce(function (a, t) { return a + t.arb; }, 0);

    var summary =
      '<div class="statstrip">' +
      stat("任务总数", S.tasks.length + " 个", false) +
      stat("样本总量", UI.num(totalSamples), false) +
      stat("已完成", UI.num(totalDone), false) +
      stat("待质检", UI.num(totalQc), false) +
      stat("待仲裁", UI.num(totalArb), true) +
      "</div>";

    var head = role === "admin"
      ? '<button class="btn btn--primary" data-go="create">' + ico("create", 15) + "创建任务</button>"
      : '<span class="chip chip--soft">' + ico("info", 12) + roleHint(role) + "</span>";

    return (
      '<div class="vw stack-4">' +
      '<div class="vw__intro"><div><h2>任务列表</h2>' +
      "<p>按角色展示当前需要处理的任务、进度与质量负载。</p></div>" + head + "</div>" +
      summary +
      '<section class="panel">' +
      '<div class="panel__head">' +
      '<div class="seg" data-role="seg">' +
      segBtn("all", "全部") + segBtn("doing", "进行中") + segBtn("open", "待领取") + segBtn("done", "已完成") +
      "</div>" +
      '<div class="spacer"></div>' +
      '<div class="search" style="width:220px">' + ico("search", 15) +
      '<input class="input" id="task-search" placeholder="搜索任务名称 / 任务ID" /></div>' +
      '<button class="btn btn--ghost btn--sm">' + ico("filter", 14) + "筛选</button>" +
      "</div>" +
      '<div class="tablewrap"><table class="tbl"><thead><tr>' +
      "<th>任务名称</th><th>标注类型</th><th class=\"right\">样本总量</th><th>进度（已完成）</th>" +
      "<th class=\"right\">待质检</th><th class=\"right\">待仲裁</th><th>标准库版本</th>" +
      "<th>创建人</th><th>截止时间</th><th>状态</th><th>操作</th>" +
      "</tr></thead><tbody id=\"task-rows\">" +
      (list.length ? list.map(function (t) { return row(t, role); }).join("") :
        '<tr><td colspan="11"><div class="empty">' + ico("tasks", 26) +
        "<b>该筛选下暂无任务</b><span>切换筛选条件或等待管理员分配新任务</span></div></td></tr>") +
      "</tbody></table></div></section></div>"
    );
  }

  function stat(label, value, accent) {
    return '<div class="statstrip__i' + (accent ? " is-accent" : "") + '">' +
      '<span class="fs-12 muted">' + UI.esc(label) + "</span>" +
      '<b class="num">' + UI.esc(value) + "</b></div>";
  }

  function segBtn(id, label) {
    return '<button data-filter="' + id + '" class="' + (filter === id ? "is-on" : "") + '">' + label + "</button>";
  }

  function roleHint(role) {
    if (role === "qcer") return "质检员：进入「待质检」列对应任务处理抽检样本";
    if (role === "arbiter") return "仲裁员：进入「待仲裁」列对应任务处理争议样本";
    return "标注员：可领取待领取任务，或继续未完成任务";
  }

  function mount(root) {
    root.querySelectorAll("[data-filter]").forEach(function (b) {
      b.addEventListener("click", function () {
        filter = b.getAttribute("data-filter");
        rerender();
      });
    });
    var s = root.querySelector("#task-search");
    if (s) {
      s.addEventListener("input", function () {
        var q = s.value.trim().toLowerCase();
        root.querySelectorAll("#task-rows tr").forEach(function (tr) {
          tr.style.display = !q || tr.textContent.toLowerCase().indexOf(q) !== -1 ? "" : "none";
        });
      });
    }
    root.querySelectorAll("[data-act]").forEach(function (b) {
      b.addEventListener("click", function () { act(b.getAttribute("data-act"), b.getAttribute("data-id")); });
    });
  }

  function act(kind, id) {
    var t = Store.state.tasks.filter(function (x) { return x.id === id; })[0];
    if (kind === "resume" || kind === "take") {
      if (kind === "take") { t.status = "进行中"; UI.toast("已领取任务 " + t.id, "ok"); }
      Store.go("workbench");
      return;
    }
    if (kind === "qc") { Store.go("quality"); return; }
    if (kind === "arb") { Store.go("arbitration"); return; }
    if (kind === "export") {
      UI.toast("已导出 " + t.id + " 的最终标签（JSON）", "ok");
      return;
    }
    if (kind === "pause") {
      UI.confirm({
        title: "暂停任务 " + t.id + "？", yes: "暂停任务",
        body: "暂停后标注员无法继续领取样本，已提交结果保留。",
        onYes: function () { t.status = "已暂停"; UI.toast("任务已暂停", "warn"); rerender(); }
      });
      return;
    }
    if (kind === "report") {
      UI.modal({
        size: "wide", title: t.name + " · 质量报告", sub: t.id + " · 绑定 " + t.ver,
        body: '<div class="stack-4">' +
          '<div class="kpi-grid">' +
          UI.kpi({ label: "标注完成率", value: UI.pct(t.done, t.total).toFixed(1), unit: "%", delta: "+6.2pt", up: true, note: "已完成 " + UI.num(t.done) }) +
          UI.kpi({ label: "待质检", value: UI.num(t.qc), unit: "条", delta: "抽检 20%", up: true, note: "含低置信 100% 全检" }) +
          UI.kpi({ label: "待仲裁", value: UI.num(t.arb), unit: "条", delta: UI.pct(t.arb, t.done).toFixed(2) + "%", up: t.arb < 200, note: "进入仲裁样本占比" }) +
          "</div>" +
          '<section class="panel"><div class="panel__head"><h3>驳回原因分布</h3></div><div class="panel__body">' + UI.hbars(DB.errDist) + "</div></section>" +
          "</div>",
        foot: '<div class="spacer"></div><button class="btn btn--ghost" data-close>关闭</button>' +
          '<button class="btn btn--primary" data-close>导出报告</button>'
      });
      return;
    }
    if (kind === "more") {
      UI.toast("更多操作：编辑 / 复制任务 / 结束任务", "info");
    }
  }

  var host = null;
  function rerender() {
    if (!host) return;
    host.innerHTML = render();
    mount(host);
  }

  window.Views = window.Views || {};
  window.Views.tasks = {
    title: "任务列表",
    sub: "有哪些任务、进度如何、我需要处理什么",
    render: function () { return render(); },
    mount: function (root) { host = root; mount(root); }
  };
})();
</script>
<script>
/* 任务创建：管理员配置「这一批数据到底要标什么、按什么规则标、用哪一版标准库」 */
(function () {
  var ico = UI.ico;

  var FIELDS = [
    { id: "transaction", label: "是否汽车交易内容", on: true, req: true },
    { id: "market", label: "新车 / 二手车", on: true, req: true },
    { id: "brand", label: "品牌", on: true, req: true },
    { id: "series", label: "车系", on: true, req: true },
    { id: "multi", label: "多车", on: true },
    { id: "primary", label: "主车", on: true },
    { id: "model", label: "车型（二期）", on: false, phase2: true },
    { id: "year", label: "年款（二期）", on: false, phase2: true }
  ];

  var form = {
    name: "汽车内容标准化_V2",
    note: "面向二手车商短视频与选车对比内容，产出品牌 / 车系标准化 Ground Truth。",
    source: "平台内容库 · 汽车垂类",
    total: "30000",
    due: "2026-10-12",
    priority: "高",
    taxonomy: DB.versions.taxonomy,
    alias: DB.versions.alias,
    rule: DB.versions.rule,
    dual: false,
    ratio: "20",
    agreement: "95"
  };

  function fieldHTML() {
    return '<div class="fieldgrid">' + FIELDS.map(function (f) {
      return '<label class="fieldchip' + (f.on ? " is-on" : "") + (f.phase2 ? " is-off" : "") + '">' +
        '<input type="checkbox" data-field="' + f.id + '" ' + (f.on ? "checked" : "") +
        (f.phase2 ? " disabled" : "") + " />" +
        '<span class="check__box">' + ico("check", 12) + "</span>" +
        '<span class="fieldchip__label">' + UI.esc(f.label) + "</span>" +
        (f.req ? '<span class="fieldchip__req">必标</span>' : "") +
        (f.phase2 ? '<span class="fieldchip__req">未开放</span>' : "") +
        "</label>";
    }).join("") + "</div>";
  }

  function summary() {
    var on = FIELDS.filter(function (f) { return f.on; }).map(function (f) { return f.label; });
    return '<ul class="sumlist">' +
      sumRow("任务名称", UI.esc(form.name)) +
      sumRow("数据来源", UI.esc(form.source)) +
      sumRow("样本量", UI.num(form.total)) +
      sumRow("截止日期", UI.esc(form.due)) +
      sumRow("优先级", UI.esc(form.priority)) +
      sumRow("标注字段", on.length + " 个：" + on.join("、")) +
      sumRow("标准库", '<span class="mono">' + UI.esc(form.taxonomy) + "</span>") +
      sumRow("别名库", '<span class="mono">' + UI.esc(form.alias) + "</span>") +
      sumRow("规则", '<span class="mono">' + UI.esc(form.rule) + "</span>") +
      sumRow("质检方式", form.dual ? "双标 + 抽检" : "单标 + 抽检") +
      sumRow("抽检比例", form.ratio + "%") +
      sumRow("一致率阈值", form.agreement + "%") +
      "</ul>";
  }

  function sumRow(k, v) {
    return '<li><span>' + k + '</span><b>' + v + "</b></li>";
  }

  function render() {
    return (
      '<div class="vw stack-4">' +
      '<div class="vw__intro"><div><h2>创建标注任务</h2>' +
      "<p>任务必须绑定标准库、别名库与规则版本，保证标注结果可追溯。</p></div>" +
      '<span class="chip chip--soft">' + ico("lock", 12) + "仅管理员可配置</span></div>" +

      '<div class="grid-main-side">' +
      '<div class="stack-4">' +

      '<section class="panel"><div class="panel__head"><h2>1 · 基础配置</h2>' +
      '<span class="panel__sub">任务说明与数据范围</span></div>' +
      '<div class="panel__body"><div class="formgrid">' +
      UI.field({ label: "任务名称", req: true, control: '<input class="input" data-k="name" value="' + UI.esc(form.name) + '" />' }) +
      UI.field({ label: "数据来源", control: '<select class="select" data-k="source">' +
        ["平台内容库 · 汽车垂类", "经销商短视频", "UGC 随手拍", "历史存量抽样"].map(function (o) {
          return '<option' + (o === form.source ? " selected" : "") + ">" + o + "</option>";
        }).join("") + "</select>" }) +
      UI.field({ label: "样本量", req: true, control: '<input class="input num" data-k="total" value="' + UI.esc(form.total) + '" />' }) +
      UI.field({ label: "截止日期", req: true, control: '<input class="input" type="date" data-k="due" value="' + UI.esc(form.due) + '" />' }) +
      UI.field({ label: "优先级", control: '<select class="select" data-k="priority">' +
        ["高", "中", "低"].map(function (o) {
          return '<option' + (o === form.priority ? " selected" : "") + ">" + o + "</option>";
        }).join("") + "</select>" }) +
      UI.field({ label: "任务说明", control: '<textarea class="textarea" rows="3" data-k="note">' + UI.esc(form.note) + "</textarea>" }) +
      "</div></div></section>" +

      '<section class="panel"><div class="panel__head"><h2>2 · 标注字段配置</h2>' +
      '<span class="panel__sub">不同任务复用同一平台，按需勾选</span></div>' +
      '<div class="panel__body stack-3">' + fieldHTML() +
      '<div class="banner banner--info">' + ico("info", 15) +
      "<span>未勾选的字段不会出现在标注工作台，也不会进入导出结构；已勾选字段为空时无法提交。</span></div>" +
      "</div></section>" +

      '<section class="panel"><div class="panel__head"><h2>3 · 标准库配置</h2>' +
      '<span class="panel__sub">必须绑定版本，否则两个月后无法解释同一表达为何映射变化</span></div>' +
      '<div class="panel__body"><div class="formgrid formgrid--3">' +
      UI.field({ label: "标准库版本", req: true, control: '<select class="select" data-k="taxonomy">' +
        ["V3.2", "V3.3-rc", "V3.1"].map(function (o) {
          return '<option' + (o === form.taxonomy ? " selected" : "") + ">" + o + "</option>";
        }).join("") + "</select>" }) +
      UI.field({ label: "别名库版本", req: true, control: '<select class="select" data-k="alias">' +
        ["V2.8", "V2.7"].map(function (o) {
          return '<option' + (o === form.alias ? " selected" : "") + ">" + o + "</option>";
        }).join("") + "</select>" }) +
      UI.field({ label: "规则版本", req: true, control: '<select class="select" data-k="rule">' +
        ["V1.5", "V1.4"].map(function (o) {
          return '<option' + (o === form.rule ? " selected" : "") + ">" + o + "</option>";
        }).join("") + "</select>" }) +
      "</div>" +
      '<div class="row row-2 wrap" style="margin-top:12px">' +
      '<span class="chip chip--mono">标准库 ' + form.taxonomy + "</span>" +
      '<span class="chip chip--mono">别名库 ' + form.alias + "</span>" +
      '<span class="chip chip--mono">规则 ' + form.rule + "</span>" +
      '<span class="fs-12 muted">共 ' + DB.brands.length + " 个品牌 · " + DB.series.length + " 个车系 · " + DB.aliases.length + " 条别名</span>" +
      "</div></div></section>" +

      '<section class="panel"><div class="panel__head"><h2>4 · 质检配置</h2>' +
      '<span class="panel__sub">一期支持单标 + 抽检，重要数据集可双标 + 仲裁</span></div>' +
      '<div class="panel__body stack-3">' +
      '<div class="switchrow">' +
      '<div><b class="fs-13">双人标注</b><p class="fs-12 muted">开启后每条样本由两名标注员独立完成，结果不一致自动进入仲裁</p></div>' +
      '<button class="switch' + (form.dual ? " is-on" : "") + '" data-toggle="dual" role="switch" aria-checked="' + form.dual + '"><i></i></button>' +
      "</div>" +
      '<div class="formgrid formgrid--3">' +
      UI.field({ label: "抽检比例", control: '<input class="input num" data-k="ratio" value="' + form.ratio + '" />', hint: "%" }) +
      UI.field({ label: "一致率阈值", control: '<input class="input num" data-k="agreement" value="' + form.agreement + '" />', hint: "%" }) +
      UI.field({ label: "低置信样本", control: '<select class="select"><option>100% 全检</option><option>50% 抽检</option></select>' }) +
      "</div></div></section>" +

      "</div>" +

      '<aside class="stack-4 sticky"><section class="panel">' +
      '<div class="panel__head"><h2>配置摘要</h2><div class="spacer"></div>' + ico("file", 14) + "</div>" +
      '<div class="panel__body" id="sum">' + summary() + "</div>" +
      '<div class="panel__foot"><button class="btn btn--ghost btn--block" data-cancel>取消</button>' +
      '<button class="btn btn--primary btn--block" data-create>' + ico("check", 15) + "创建任务</button></div>" +
      "</section>" +
      '<section class="panel"><div class="panel__head"><h3>创建后会发生什么</h3></div>' +
      '<ol class="stepslist">' +
      "<li><b>样本导入</b><span>按数据来源拉取样本并预加载视频 / ASR / OCR</span></li>" +
      "<li><b>任务分发</b><span>标注员领取，按质检配置进入抽检池</span></li>" +
      "<li><b>标准库版本锁定</b><span>任务内所有映射记录所属版本，可回溯</span></li>" +
      "</ol></section></aside>" +
      "</div></div>"
    );
  }

  function syncSummary(root) {
    var el = root.querySelector("#sum");
    if (el) el.innerHTML = summary();
  }

  function mount(root) {
    root.querySelectorAll("[data-k]").forEach(function (el) {
      el.addEventListener("input", function () {
        form[el.getAttribute("data-k")] = el.value;
        syncSummary(root);
      });
      el.addEventListener("change", function () {
        form[el.getAttribute("data-k")] = el.value;
        syncSummary(root);
      });
    });
    root.querySelectorAll("[data-field]").forEach(function (el) {
      el.addEventListener("change", function () {
        var id = el.getAttribute("data-field");
        FIELDS.forEach(function (f) { if (f.id === id) f.on = el.checked; });
        el.closest(".fieldchip").classList.toggle("is-on", el.checked);
        syncSummary(root);
      });
    });
    var sw = root.querySelector('[data-toggle="dual"]');
    if (sw) sw.addEventListener("click", function () {
      form.dual = !form.dual;
      sw.classList.toggle("is-on", form.dual);
      sw.setAttribute("aria-checked", String(form.dual));
      syncSummary(root);
    });
    var c = root.querySelector("[data-create]");
    if (c) c.addEventListener("click", function () {
      var maxId = Store.state.tasks.reduce(function (m, t) {
        var n = parseInt(t.id.replace(/\D/g, ""), 10);
        return n > m ? n : m;
      }, 0);
      var id = "TASK_" + (maxId + 1);
      Store.state.tasks.unshift({
        id: id, name: form.name, fields: FIELDS.filter(function (f) { return f.on; }).slice(0, 3).map(function (f) { return f.label; }).join(" + "),
        total: parseInt(form.total, 10) || 0, done: 0, qc: 0, arb: 0,
        owner: (DB.roles.filter(function (r) { return r.id === "admin"; })[0] || {}).who.split(" · ")[1] || "王敏",
        ver: form.taxonomy, status: "待领取", due: form.due
      });
      Store.log("创建任务", "—", id + " · " + form.name);
      UI.toast("任务 " + id + " 创建成功，已进入待领取", "ok", 3200);
      Store.go("tasks");
    });
    var x = root.querySelector("[data-cancel]");
    if (x) x.addEventListener("click", function () { Store.go("tasks"); });
  }

  window.Views = window.Views || {};
  window.Views.create = {
    title: "任务创建",
    sub: "配置标注范围、规则与标准库版本",
    render: render, mount: mount
  };
})();
</script>
<script>
/* 标注工作台：看视频和证据 → 结构化标准实体选择 → 找不到时一键标准缺口提报 */
(function () {
  var ico = UI.ico;
  var root = null;
  var timer = null;

  /* view-local UI state (never persisted, so seed changes stay visible) */
  var L = {
    play: false, t: 0, speed: 1, errs: [], submitting: null,
    q: {}, open: {}, focusKey: null
  };

  function sample() { return Store.currentSample(); }
  function form() { return Store.formOf(sample()); }
  function timecode(sec) {
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function keyframes() {
    var s = sample();
    if (!s) return [];
    var labels = ["车辆外观", "车辆内饰", "报价 / 分期", "车况细节"];
    return [0, 0.26, 0.56, 0.82].map(function (p, i) {
      return { t: Math.round(s.duration * p), label: labels[i] };
    });
  }
  function activeKf() {
    var kfs = keyframes(), idx = 0;
    kfs.forEach(function (k, i) { if (L.t >= k.t) idx = i; });
    return idx;
  }
  function hl(text, aliases) {
    var out = UI.esc(text);
    (aliases || []).forEach(function (a) {
      var re = new RegExp(a.raw.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
      out = out.replace(re, '<mark class="asr__hit">' + a.raw + "</mark>");
    });
    return out;
  }

  /* ---------------- player ---------------- */

  function player() {
    var s = sample(), f = form();
    var kfs = keyframes(), ak = activeKf();
    var prog = s.duration ? Math.min(100, (L.t / s.duration) * 100) : 0;
    var subtitle = s.asr.length > 46 ? s.asr.slice(0, 46) + "…" : s.asr;

    var marks = kfs.map(function (k) {
      return '<span class="seek__kf" style="left:' + (k.t / s.duration) * 100 + '%"></span>';
    }).join("");

    return (
      '<section class="panel player">' +
      '<div class="player__frame">' + UI.carFrame({ body: s.body, accent: s.accent }) +
