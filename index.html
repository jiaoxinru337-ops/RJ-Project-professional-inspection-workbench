      '<span class="player__tc mono">' + timecode(L.t) + " / " + timecode(s.duration) + "</span>" +
      '<span class="player__badge">' + (L.play ? "播放中" : "已暂停") + " · " + L.speed + "x</span>" +
      (s.ocr[0] ? '<span class="ocrbox" style="left:5%;bottom:22%">' + UI.esc(s.ocr[0]) + "</span>" : "") +
      (s.ocr[1] ? '<span class="ocrbox" style="right:5%;top:10%">' + UI.esc(s.ocr[1]) + "</span>" : "") +
      '<span class="subbar">' + hl(subtitle, s.aliasHits) + "</span>" +
      "</div>" +

      '<div class="seek" data-seek><div class="seek__track"><div class="seek__fill" style="width:' + prog + '%"></div>' +
      marks + '<span class="seek__head" style="left:' + prog + '%"></span></div></div>' +

      '<div class="player__ctrl">' +
      '<button class="iconbtn" data-nav="-1" title="上一条" aria-label="上一条">' + ico("prev", 16) + "</button>" +
      '<button class="iconbtn iconbtn--play" data-play aria-label="播放/暂停">' + ico(L.play ? "pause" : "play", 17) + "</button>" +
      '<button class="iconbtn" data-nav="1" title="下一条" aria-label="下一条">' + ico("skip", 16) + "</button>" +
      '<span class="player__time mono">' + timecode(L.t) + "</span>" +
      '<div class="spacer"></div>' +
      '<div class="seg seg--sm">' + [0.5, 1, 1.5, 2].map(function (v) {
        return '<button data-speed="' + v + '" class="' + (L.speed === v ? "is-on" : "") + '">' + v + "x</button>";
      }).join("") + "</div>" +
      '<button class="btn btn--sm btn--ghost" data-shot>' + ico("scissors", 14) + "截图</button>" +
      "</div>" +

      '<div class="thumbs">' + kfs.map(function (k, i) {
        return '<button class="thumb' + (i === ak ? " is-on" : "") + '" data-kf="' + k.t + '">' +
          '<span class="thumb__mini">' + UI.carFrame({ body: s.body, accent: i === ak ? s.accent : "#5A6B82" }) + "</span>" +
          '<span class="thumb__l">' + k.label + '</span><span class="thumb__t mono">' + timecode(k.t) + "</span></button>";
      }).join("") + "</div></section>"
    );
  }

  /* ---------------- evidence ---------------- */

  function evidence() {
    var s = sample();
    var alias = s.aliasHits && s.aliasHits[0];
    return (
      '<div class="stack-3 evidence-pane">' +
      '<section class="panel evidence-panel"><div class="panel__head"><h2>证据记录</h2>' +
      '<span class="panel__sub mono">样本 ' + UI.esc(s.id) + "</span>" +
      '<div class="spacer"></div><span class="evidence-duration mono">' + s.duration + " 秒</span></div>" +
      '<div class="panel__body">' +
      '<div class="evidence-track">' +

      '<section class="evidence-track__item" data-source="标题">' +
      '<div class="evi__blockhead"><span class="evi__tag">标题</span>' +
      '<span class="fs-11 muted">原始内容与发布信息</span></div>' +
      '<h3 class="evi__title">' + UI.esc(s.title) + "</h3>" +
      '<div class="evi__meta">' +
      metaItem("来源", s.meta.source) + metaItem("发布", s.meta.publishAt) +
      metaItem("作者", s.meta.author) + metaItem("任务", s.task) +
      "</div>" +
      '<div class="evi__tags">' + s.hashtags.map(function (h) {
        return '<span class="tag">' + ico("tag", 12) + UI.esc(h) + "</span>";
      }).join("") + "</div></section>" +

      '<section class="evidence-track__item" data-source="ASR"><div class="evi__blockhead"><span class="evi__tag">ASR</span>' +
      '<span class="fs-11 muted">自动语音识别 · 置信度 0.9' + (s.id === "100236" ? "（无有效口播）" : "2") + "</span></div>" +
      '<p class="evi__text">' + hl(s.asr, s.aliasHits) + "</p></section>" +

      '<section class="evidence-track__item" data-source="OCR"><div class="evi__blockhead"><span class="evi__tag">OCR</span>' +
      '<span class="fs-11 muted">画面文字</span></div>' +
      (s.ocr.length
        ? '<div class="row row-2 wrap">' + s.ocr.map(function (o) {
          return '<span class="chip chip--line">' + UI.esc(o) + "</span>";
        }).join("") + "</div>"
        : '<p class="evi__text muted">画面未识别到稳定文字</p>') + "</section></div>" +

      (alias
        ? '<div class="aliasbox"><div class="aliasbox__head">' + ico("sparkle", 14) +
          "<b>识别到别名</b><span>来自别名库 " + DB.versions.alias + "</span></div>" +
          UI.trace(alias.raw, DB.seriesLabel(alias.target) || alias.target) +
          '<div class="row row-2"><button class="btn btn--sm btn--primary" data-adopt="' + alias.target + '">采用该标准实体</button>' +
          '<button class="btn btn--sm btn--quiet" data-gap-raw="' + UI.esc(alias.raw) + '">不是同一个车系</button></div>' +
          "</div>"
        : "") +

      (s.conflict
        ? '<div class="banner banner--warn">' + ico("gap", 15) +
          "<span><b>标题与内容主体冲突：</b>" + UI.esc(s.conflict) +
          "。按规则 13.3 以主体语义证据为准，并记录冲突标记。</span></div>"
        : "") +

      (s.ruleHit
        ? '<div class="banner banner--accent">' + ico("book", 15) +
          "<span><b>命中标注规范：</b>" + UI.esc(s.ruleHit) + "</span></div>"
        : "") +

      (s.gap
        ? '<div class="banner banner--info">' + ico("info", 15) +
          "<span><b>标准库可能缺失：</b>「" + UI.esc(s.gap.seriesMissing) +
          "」在标准车系库中不存在，请使用「标准库无对应项」提报，不要映射到相似车系。</span></div>"
        : "") +

      "</div></section></div>"
    );
  }

  function metaItem(k, v) {
    return '<span class="evi__meta-i"><i>' + UI.esc(k) + "</i><b>" + UI.esc(v) + "</b></span>";
  }

  /* ---------------- annotation ---------------- */

  function radioRow(name, options, value, key) {
    return '<div class="optlist">' + options.map(function (o) {
      var on = value === o.v;
      return '<label class="radio' + (on ? " is-on" : "") + '">' +
        '<input type="radio" name="' + name + '" data-set="' + key + '" value="' + o.v + '"' + (on ? " checked" : "") + " />" +
        '<span class="radio__dot"></span><span class="radio__text">' + UI.esc(o.t) +
        (o.note ? '<span class="radio__note">' + UI.esc(o.note) + "</span>" : "") + "</span></label>";
    }).join("") + "</div>";
  }

  function brandPicker(vi, v, openKey) {
    var q = L.q[vi] != null ? L.q[vi] : "";
    var open = L.open[openKey];
    var list = DB.brands.filter(function (b) {
      if (b.status !== "启用") return false;
      if (!q) return true;
      var s = (b.cn + b.en + b.id).toLowerCase();
      return s.indexOf(q.toLowerCase()) !== -1;
    });
    var aliasHits = q ? DB.matchAlias(q).filter(function (a) { return a.type === "brand" || a.type === "series"; }) : [];

    return (
      '<div class="picker" data-picker="' + openKey + '">' +
      '<div class="search"><span>' + ico("search", 15) + "</span>" +
      '<input class="input" data-bq="' + vi + '" data-key="bq-' + vi + '" placeholder="搜索品牌中文名 / 英文名 / 别名" value="' + UI.esc(q) + '" />' +
      "</div>" +
      (v.brandId
        ? '<div class="pickrow"><span class="chip chip--soft">' + UI.esc(DB.brandLabel(v.brandId)) +
          '<span class="mono" style="opacity:.75">' + UI.esc(v.brandId) + "</span></span>" +
          '<button class="btn btn--sm btn--quiet" data-clearbrand="' + vi + '">' + ico("close", 13) + "</button></div>"
        : "") +

      (aliasHits.length
        ? '<div class="hintlist">' + aliasHits.map(function (a) {
          return '<button class="hint" data-applyalias="' + vi + '" data-target="' + a.target + '" data-type="' + a.type + '">' +
            '<span class="hint__raw">' + UI.esc(a.alias) + "</span>" + ico("arrowRight", 13) +
            '<span class="hint__std">' + UI.esc(a.type === "brand" ? DB.brandLabel(a.target) : DB.seriesLabel(a.target)) + "</span>" +
            '<span class="hint__src">' + UI.esc(a.source) + "</span></button>";
        }).join("") + "</div>"
        : "") +

      '<div class="picker__list' + (open ? " is-open" : "") + '">' +
      (list.length
        ? list.map(function (b) {
          return '<button class="pickitem' + (v.brandId === b.id ? " is-on" : "") + '" data-pickbrand="' + vi + '" data-brand="' + b.id + '">' +
            '<span class="pickitem__cn">' + UI.esc(b.cn) + "</span>" +
            '<span class="pickitem__en">' + UI.esc(b.en) + "</span>" +
            '<span class="pickitem__id mono">' + UI.esc(b.id) + "</span></button>";
        }).join("")
        : '<div class="picker__empty">' + ico("search", 15) + "<span>标准品牌库无匹配项</span>" +
          '<button class="btn btn--sm btn--ghost" data-gap-raw="' + UI.esc(q) + '" data-gap-type="new_entity">提报新品牌</button></div>') +
      "</div></div>"
    );
  }

  function seriesPicker(vi, v) {
    var s = sample();
    if (!v.brandId) {
      return '<p class="fs-12 muted">请先选择品牌，车系将按品牌过滤，避免跨品牌错选。</p>';
    }
    if (s.gap && v.brandId === s.gap.brand) {
      return (
        '<div class="serieslist is-empty">' +
        '<div class="picker__empty">' + ico("gap", 16) +
        "<div><b>该品牌下没有匹配车系</b><span>「" + UI.esc(s.gap.seriesMissing) + "」尚未进入标准车系库</span></div>" +
        "</div>" +
        '<button class="btn btn--sm btn--primary btn--block" data-gap-raw="' + UI.esc(s.gap.seriesMissing) + '" data-gap-brand="' + UI.esc(s.gap.brand) + '" data-gap-type="new_entity">' +
        ico("flag", 14) + "标准库无对应项 · 发起提报</button>" +
        '<p class="fs-11 muted">提报通过前，本样本车系暂记为 <span class="mono">PENDING</span>（待补录），不得映射到相似车系。</p>' +
        "</div>"
      );
    }
    var list = DB.seriesOf(v.brandId);
    return (
      '<div class="serieslist">' + (list.length ? list.map(function (x) {
        var on = v.seriesId === x.id;
        return '<button class="seriesitem' + (on ? " is-on" : "") + '" data-pickseries="' + vi + '" data-series="' + x.id + '" aria-pressed="' + on + '">' +
          '<span class="seriesitem__n">' + UI.esc(x.name) + "</span>" +
          '<span class="seriesitem__id mono">' + UI.esc(x.id) + "</span></button>";
      }).join("") : '<p class="fs-12 muted">该品牌下暂无车系，请发起新标准实体提报。</p>') +
      '<button class="gapbtn" data-gap-raw="' + UI.esc((DB.brand(v.brandId) || {}).cn || "") + '" data-gap-type="new_entity">' +
      ico("flag", 14) + "标准库无对应项 · 缺口提报</button></div>"
    );
  }

  function annotate() {
    var s = sample(), f = form();
    var filled = f.vehicles.filter(function (v) { return v.brandId; });

    var vehicleRows = f.vehicles.map(function (v, i) {
      return '<div class="vehrow">' +
        '<div class="vehrow__head"><span class="vehrow__n">车 ' + (i + 1) + "</span>" +
        (f.multi && f.vehicles.length > 2
          ? '<button class="btn btn--sm btn--quiet" data-delvehicle="' + i + '">' + ico("minus", 13) + "</button>" : "") +
        "</div>" +
        brandPicker(i, v, "b" + i) +
        '<div class="vehrow__series">' + seriesPicker(i, v) + "</div></div>";
    }).join("");

    var steps = [];
    steps.push(["是否属于汽车交易内容", true,
      radioRow("transaction", [
        { v: "yes", t: "是" }, { v: "no", t: "否" }, { v: "unknown", t: "无法判断" }
      ], f.transaction, "transaction")]);

    steps.push(["交易类型", true,
      radioRow("market", [
        { v: "NEW", t: "NEW · 新车" }, { v: "USED", t: "USED · 二手车" },
        { v: "MIXED", t: "MIXED · 新车+二手" }, { v: "UNKNOWN", t: "UNKNOWN · 无法判断" },
        { v: "NON_TRANSACTION", t: "NON_TRANSACTION · 非交易" }
      ], f.market, "market") +
      (s.conflict
        ? '<label class="check" style="margin-top:9px"><input type="checkbox" data-conflict' + (f.conflict ? " checked" : "") + ' />' +
          '<span class="check__box">' + ico("check", 12) + "</span>" +
          '<span class="check__text">标记为冲突样本（标题与主体不一致）</span></label>'
        : "")]);

    steps.push([f.multi ? "品牌 / 车系（逐车标注）" : "品牌 / 车系", true,
      '<div class="switchrow switchrow--tight" style="margin-bottom:10px">' +
      '<div><b class="fs-13">多车内容</b><p class="fs-12 muted">内容涉及 ≥ 2 辆车，需逐车标注并判定主车（规则 13.1）</p></div>' +
      '<button class="switch' + (f.multi ? " is-on" : "") + '" data-toggle="multi" role="switch" aria-checked="' + f.multi + '"><i></i></button>' +
      "</div>" +
      '<div class="vehlist">' + vehicleRows +
      (f.multi && f.vehicles.length < 5
        ? '<button class="btn btn--sm btn--ghost btn--block" data-addvehicle>' + ico("plus", 14) + "增加一辆车</button>" : "") +
      "</div>"]);

    if (f.multi) {
    steps.push(["主车", true,
        '<div class="stack-2">' + radioRow("primary", filled.map(function (v) {
          return { v: v.seriesId || "PENDING", t: DB.brandLabel(v.brandId) + " · " + (DB.seriesLabel(v.seriesId) || v.seriesId || "PENDING") };
        }).concat([{ v: "UNKNOWN", t: "UNKNOWN · 多车权重接近", note: "权重接近时不得强行选主车（规则 13.2）" }]), f.primary, "primary") +
        "</div>"]);
    }

    steps.push(["备注", false,
      '<textarea class="textarea" rows="2" data-note placeholder="补充说明，例如「准新车按规则 13.6 记 USED」">' + UI.esc(f.note) + "</textarea>"]);

    return (
      '<div class="stack-3 annotation-pane">' +
      '<section class="panel"><div class="panel__head"><h2>标注操作</h2>' +
      '<span class="panel__sub">只允许选择标准实体，不允许自由填写</span>' +
      '<div class="spacer"></div><span class="chip chip--mono">标准库 ' + DB.versions.taxonomy + '</span></div>' +
      '<div class="panel__body stack-4">' +

      steps.map(function (st, i) { return step(i + 1, st[0], st[1], st[2]); }).join("") +

      "</div>" +
      '<div class="panel__foot">' +
      '<button class="btn btn--ghost btn--block" data-gap-open>' + ico("flag", 15) + "标准库无对应项 · 发起提报</button>" +
      "</div></section>" +

      (L.errs.length
        ? '<div class="errors">' + ico("gap", 15) + "<div><b>还有 " + L.errs.length + " 项必标未完成</b>" +
          "<ul>" + L.errs.map(function (e) { return "<li>" + UI.esc(e) + "</li>"; }).join("") + "</ul></div></div>"
        : "") +
      "</div>"
    );
  }

  function step(n, title, req, body) {
    return '<div class="aststep"><div class="aststep__head"><span class="aststep__n">' + n + "</span>" +
      '<b class="aststep__t">' + UI.esc(title) + (req ? '<span class="field__req"> *</span>' : "") + "</b></div>" +
      '<div class="aststep__body">' + body + "</div></div>";
  }

  /* ---------------- page ---------------- */

  function header() {
    var S = Store.state, s = sample();
    var dots = S.samples.map(function (x, i) {
      var sub = S.wb.submitted[x.id];
      return '<button class="qdot' + (i === S.wb.index ? " is-on" : "") + (sub ? " is-done" : "") +
        '" data-jump="' + i + '" title="样本 ' + x.id + '"></button>';
    }).join("");
    return (
      '<div class="wbhead">' +
      '<div class="wbhead__l">' +
      '<span class="chip chip--mono">' + s.task + "</span>" +
      '<div class="wbhead__p"><div class="prog prog--wide"><div class="prog__bar"><div class="prog__fill" style="width:' +
      UI.pct(S.progressDone, S.progressTotal) + '%"></div></div>' +
      '<span class="prog__txt">' + S.progressDone + " / " + S.progressTotal + "</span></div></div>" +
      "</div>" +
      '<div class="spacer"></div>' +
      '<div class="wbhead__q"><span class="fs-12 muted">样本 ' + (S.wb.index + 1) + " / " + S.samples.length + "</span>" +
      '<div class="qdots">' + dots + "</div></div>" +
      '<button class="btn btn--ghost btn--sm" data-rules>' + ico("book", 14) + "规则说明</button>" +
      "</div>"
    );
  }

  function footer() {
    var S = Store.state;
    return (
      '<div class="wbfoot">' +
      '<button class="btn btn--ghost" data-nav="-1"' + (S.wb.index === 0 ? " disabled" : "") + ">" + ico("chevronLeft", 15) + "上一条</button>" +
      '<button class="btn btn--quiet" data-skip>跳过</button>' +
      '<span class="fs-12 muted" data-save>' + (S.wb.savedAt ? "草稿已自动保存 " + S.wb.savedAt : "草稿将在首次操作后自动保存") + "</span>" +
      '<div class="spacer"></div>' +
      '<button class="btn btn--ghost" data-save-now>' + ico("save", 15) + "保存草稿</button>" +
      '<button class="btn btn--primary btn--lg" data-submit>' + ico("check", 16) + "提交并下一条</button>" +
      "</div>"
    );
  }

  function render() {
    return (
      '<div class="vw vw--wb">' +
      header() +
      '<div class="wbgrid">' +
      player() +
      evidence() +
      annotate() +
      "</div>" +
      footer() +
      "</div>"
    );
  }

  /* ---------------- binding ---------------- */

  function paint(keepFocus) {
    if (!root) return;
    var key = keepFocus ? L.focusKey : null;
    root.innerHTML = render();
    bind();
    if (key) {
      var el = root.querySelector('[data-key="' + key + '"]');
      if (el) {
        el.focus({ preventScroll: true });
        if (el.setSelectionRange) {
          var n = el.value.length;
          try { el.setSelectionRange(n, n); } catch (e) { /* checkbox etc. */ }
        }
      }
    }
  }

  function bind() {
    var S = Store.state;

    root.querySelectorAll("[data-play]").forEach(function (b) {
      b.addEventListener("click", function () {
        L.play = !L.play;
        tickSetup();
        paint();
      });
    });
    root.querySelectorAll("[data-speed]").forEach(function (b) {
      b.addEventListener("click", function () {
        L.speed = parseFloat(b.getAttribute("data-speed"));
        tickSetup();
        paint();
      });
    });
    root.querySelectorAll("[data-nav]").forEach(function (b) {
      b.addEventListener("click", function () {
        StopPlay();
        Store.step(parseInt(b.getAttribute("data-nav"), 10));
        paint();
      });
    });
    root.querySelectorAll("[data-jump]").forEach(function (b) {
      b.addEventListener("click", function () {
        StopPlay();
        Store.jump(parseInt(b.getAttribute("data-jump"), 10));
        paint();
      });
    });
    root.querySelectorAll("[data-kf]").forEach(function (b) {
      b.addEventListener("click", function () {
        L.t = parseInt(b.getAttribute("data-kf"), 10);
        paint();
      });
    });
    var seek = root.querySelector("[data-seek]");
    if (seek) {
      seek.addEventListener("click", function (e) {
        var r = seek.getBoundingClientRect();
        var p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        L.t = Math.round(p * sample().duration);
        paint();
      });
    }
    var shot = root.querySelector("[data-shot]");
    if (shot) shot.addEventListener("click", function () {
      UI.toast("已截取 " + timecode(L.t) + " 画面并附加到样本 " + sample().id, "ok");
    });

    /* annotation inputs */
    root.querySelectorAll("[data-set]").forEach(function (el) {
      el.addEventListener("change", function () {
        var k = el.getAttribute("data-set");
        var p = {}; p[k] = el.value;
        if (k === "transaction" && el.value === "no") p.market = "NON_TRANSACTION";
        if (k === "transaction" && el.value !== "no" && form().market === "NON_TRANSACTION") p.market = null;
        Store.patch(p);
        L.errs = L.errs.filter(function (x) { return true; });
        paint();
      });
    });
    root.querySelectorAll("[data-toggle]").forEach(function (b) {
      b.addEventListener("click", function () {
        Store.setMulti(!form().multi);
        paint();
      });
    });
    root.querySelectorAll("[data-conflict]").forEach(function (el) {
      el.addEventListener("change", function () { Store.patch({ conflict: el.checked }); paint(); });
    });
    var note = root.querySelector("[data-note]");
    if (note) {
      note.addEventListener("input", function () {
        var f = form(); f.note = note.value;
        S.wb.savedAt = new Date().toTimeString().slice(0, 8);
        var sv = root.querySelector("[data-save]");
        if (sv) sv.textContent = "草稿已自动保存 " + S.wb.savedAt;
      });
    }

    /* brand picker */
    root.querySelectorAll("[data-bq]").forEach(function (el) {
      el.addEventListener("click", function () {
        L.focusKey = el.getAttribute("data-key");
        L.open["b" + el.getAttribute("data-bq")] = true;
        paint(true);
      });
      el.addEventListener("input", function () {
        var vi = el.getAttribute("data-bq");
        L.focusKey = el.getAttribute("data-key");
        L.q[vi] = el.value;
        L.open["b" + vi] = true;
        paint(true);
      });
    });
    root.querySelectorAll("[data-pickbrand]").forEach(function (b) {
      b.addEventListener("click", function () {
        var vi = parseInt(b.getAttribute("data-pickbrand"), 10);
        var f = form();
        f.vehicles[vi].brandId = b.getAttribute("data-brand");
        f.vehicles[vi].seriesId = null;
        L.q[vi] = ""; L.open["b" + vi] = false; L.focusKey = null;
        Store.patch({});
        paint();
      });
    });
    root.querySelectorAll("[data-clearbrand]").forEach(function (b) {
      b.addEventListener("click", function () {
        var vi = parseInt(b.getAttribute("data-clearbrand"), 10);
        var f = form();
        f.vehicles[vi].brandId = null; f.vehicles[vi].seriesId = null;
        Store.patch({});
        paint();
      });
    });
    root.querySelectorAll("[data-pickseries]").forEach(function (b) {
      b.addEventListener("click", function () {
        var vi = parseInt(b.getAttribute("data-pickseries"), 10);
        var f = form();
        f.vehicles[vi].seriesId = b.getAttribute("data-series");
        if (!f.multi) f.primary = f.vehicles[vi].seriesId;
        Store.patch({});
        paint();
      });
    });
    root.querySelectorAll("[data-applyalias]").forEach(function (b) {
      b.addEventListener("click", function () {
        var vi = parseInt(b.getAttribute("data-applyalias"), 10);
        var type = b.getAttribute("data-type");
        var target = b.getAttribute("data-target");
        var f = form();
        if (type === "series") {
          var sr = DB.seriesById(target);
          f.vehicles[vi].brandId = sr ? sr.brand : f.vehicles[vi].brandId;
          f.vehicles[vi].seriesId = target;
        } else {
          f.vehicles[vi].brandId = target;
        }
        L.q[vi] = ""; L.open["b" + vi] = false;
        Store.patch({});
        UI.toast("已按别名库映射到 " + (type === "brand" ? DB.brandLabel(target) : DB.seriesLabel(target)), "ok");
        paint();
      });
    });
    root.querySelectorAll("[data-adopt]").forEach(function (b) {
      b.addEventListener("click", function () {
        var target = b.getAttribute("data-adopt");
        var sr = DB.seriesById(target);
        var f = form();
        f.vehicles[0].brandId = sr ? sr.brand : f.vehicles[0].brandId;
        f.vehicles[0].seriesId = target;
        if (!f.multi) f.primary = target;
        Store.patch({});
        UI.toast("已采用标准实体 " + DB.seriesLabel(target), "ok");
        paint();
      });
    });
    root.querySelectorAll("[data-addvehicle]").forEach(function (b) {
      b.addEventListener("click", function () { Store.addVehicle(); paint(); });
    });
    root.querySelectorAll("[data-delvehicle]").forEach(function (b) {
      b.addEventListener("click", function () { Store.removeVehicle(parseInt(b.getAttribute("data-delvehicle"), 10)); paint(); });
    });

    /* gap report */
    root.querySelectorAll("[data-gap-raw], [data-gap-open]").forEach(function (b) {
      b.addEventListener("click", function () {
        var s = sample();
        window.openGapReport({
          type: b.getAttribute("data-gap-type") || "",
          raw: b.getAttribute("data-gap-raw") || (s && s.gap ? s.gap.seriesMissing : ""),
          brandId: b.getAttribute("data-gap-brand") || null,
          sample: s
        }, function (report) {
          if (report && report.type === "新标准实体" && s.gap) {
            var f = form();
            f.vehicles[0].brandId = s.gap.brand;
            f.vehicles[0].seriesId = "PENDING";
            Store.patch({ note: f.note || "标准库无对应项，车系暂记 PENDING（待补录），已提报 " + report.id });
          }
          paint();
        });
      });
    });

    /* rules drawer */
    var rb = root.querySelector("[data-rules]");
    if (rb) rb.addEventListener("click", openRules);

    /* footer */
    var sub = root.querySelector("[data-submit]");
    if (sub) sub.addEventListener("click", doSubmit);
    var sk = root.querySelector("[data-skip]");
    if (sk) sk.addEventListener("click", function () {
      Store.log("跳过样本", sample().id, "—", "跳过");
      UI.toast("已跳过样本 " + sample().id + "，未计入完成量", "warn");
      StopPlay();
      Store.step(1);
      paint();
    });
    var sv = root.querySelector("[data-save-now]");
    if (sv) sv.addEventListener("click", function () {
      Store.saveDraft();
      paint();
    });
  }

  function doSubmit() {
    var s = sample();
    var r = Store.submit();
    if (!r.ok) {
      L.errs = r.errs;
      paint();
      var el = root.querySelector(".errors");
      if (el) el.scrollIntoView({ block: "nearest" });
      UI.toast("还有 " + r.errs.length + " 项必标未完成", "warn");
      return;
    }
    L.errs = [];
    StopPlay();
    L.t = 0;
    L.q = {}; L.open = {}; L.focusKey = null;
    paint();
    if (r.cmp.same) {
      UI.toast("样本 " + s.id + " 提交成功 · 与标准答案一致", "ok");
    } else {
      UI.toast("样本 " + s.id + " 已提交 · 与标准答案存在差异（" + r.cmp.diffs.join("、") + "），已进入质检抽检池", "warn", 3800);
    }
  }

  function openRules() {
    UI.drawer({
      title: "标注规范 · 边界规则",
      sub: "规则 " + DB.versions.rule + " · 边界规则，标注与质检共用同一口径",
      body: '<ol class="rulelist">' + DB.rules.map(function (r) {
        return "<li><span class=\"rulelist__n mono\">" + r.id + "</span>" +
          "<div><b>" + UI.esc(r.t) + "</b><p>" + UI.esc(r.d) + "</p></div></li>";
      }).join("") + "</ol>",
      foot: '<button class="btn btn--ghost btn--block" data-close>我知道了</button>'
    });
  }

  /* ---------------- playback loop ---------------- */

  function StopPlay() {
    L.play = false;
    if (timer) { clearInterval(timer); timer = null; }
  }

  function tickSetup() {
    if (timer) { clearInterval(timer); timer = null; }
    if (!L.play) return;
    timer = setInterval(function () {
      var s = sample();
      if (!s) { StopPlay(); return; }
      L.t = L.t + L.speed;
      if (L.t >= s.duration) { L.t = s.duration; StopPlay(); }
      updatePlayhead();
    }, 1000);
  }

  /* tick only touches the player chrome, so annotation state is never disturbed */
  function updatePlayhead() {
    if (!root) return;
    var s = sample();
    var prog = Math.min(100, (L.t / s.duration) * 100);
    var fill = root.querySelector(".seek__fill");
    var head = root.querySelector(".seek__head");
    if (fill) fill.style.width = prog + "%";
    if (head) head.style.left = prog + "%";
    var tc = root.querySelector(".player__time");
    if (tc) tc.textContent = timecode(L.t);
    var badge = root.querySelector(".player__tc");
    if (badge) badge.textContent = timecode(L.t) + " / " + timecode(s.duration);
    var thumbs = root.querySelectorAll(".thumb");
    var ak = activeKf();
    thumbs.forEach(function (t, i) { t.classList.toggle("is-on", i === ak); });
  }

  window.Views = window.Views || {};
  window.Views.workbench = {
    title: "标注工作台",
    sub: "看全部证据 → 结构化标准实体选择 → 找不到时缺口提报",
    render: function () { return render(); },
    mount: function (r) {
      root = r;
      L.errs = [];
      paint();
    },
    unmount: function () { StopPlay(); }
  };
})();
</script>
<script>
/* 标准缺口提报：平台区别于普通标注平台的核心能力 */
(function () {
  var ico = UI.ico;
  var root = null;
  var filter = "all";

  function typeLabel(id) {
    var t = DB.gapTypes.filter(function (x) { return x.id === id; })[0];
    return t ? t.label : id;
  }

  function statusOf(s) { return DB.gapStatusMeta[s] || "status--wait"; }

  function statCard(t) {
    var n = Store.state.gaps.filter(function (g) { return g.type === t.label; }).length;
    return '<div class="typecard"><div class="typecard__top"><b>' + UI.esc(t.label) + "</b>" +
      '<span class="num">' + n + "</span></div>" +
      "<p>" + UI.esc(t.desc) + "</p></div>";
  }

  function rows() {
    var S = Store.state;
    var role = S.role;
    return S.gaps.filter(function (g) {
      if (filter === "all") return true;
      if (filter === "open") return g.status === "待审核" || g.status === "待仲裁";
      return g.status === "已入库" || g.status === "审核通过";
    }).map(function (g) {
      var actions = "";
      if (role === "admin" && (g.status === "待审核" || g.status === "待仲裁")) {
        actions = '<div class="row-actions">' +
          '<button class="btn btn--sm btn--primary" data-gap-ok="' + g.id + '">通过并入库</button>' +
          '<button class="btn btn--sm btn--ghost" data-gap-no="' + g.id + '">驳回</button></div>';
      } else if (role === "admin" && g.status === "审核通过") {
        actions = '<button class="btn btn--sm btn--primary" data-gap-rel="' + g.id + '">发布新版本</button>';
      } else {
        actions = '<span class="fs-12 muted">' + (g.status === "已入库" ? "已进入 " + g.ver : "等待审核") + "</span>";
      }
      return '<tr data-gap-row="' + g.id + '">' +
        '<td class="mono fs-12 muted">' + UI.esc(g.id) + "</td>" +
        "<td>" + UI.status(g.type, "status--wait") + "</td>" +
        '<td><span class="strong">' + UI.esc(g.raw) + "</span></td>" +
        '<td><span class="trace trace--inline"><span class="trace__arrow">' + ico("arrowRight", 12) +
        '</span><span class="trace__std">' + UI.esc(g.suggest) + '</span><span class="trace__raw mono">' + UI.esc(g.suggestId) + "</span></span></td>" +
        '<td><span class="chip">' + UI.esc(g.source) + "</span> " +
        '<span class="mono fs-11 muted">' + UI.esc(g.contentId) + " · " + UI.esc(g.time) + "</span></td>" +
        '<td class="muted-2">' + UI.esc(g.note) + "</td>" +
        '<td class="muted fs-12">' + UI.esc(g.by) + "<br />" + UI.esc(g.at) + "</td>" +
        "<td>" + UI.status(g.status, statusOf(g.status)) + "</td>" +
        "<td>" + actions + "</td></tr>";
    }).join("");
  }

  function render() {
    var S = Store.state;
    var openCount = S.gaps.filter(function (g) { return g.status === "待审核" || g.status === "待仲裁"; }).length;
    var isAdmin = S.role === "admin";

    return (
      '<div class="vw stack-4">' +
      '<div class="vw__intro"><div><h2>标准缺口提报</h2>' +
      "<p>标注过程中发现标准库没有的表达、实体或规则，统一在这里收集、审核、入库。</p></div>" +
      '<button class="btn btn--primary" data-newgap>' + ico("flag", 15) + "发起提报</button></div>" +

      '<div class="grid-4">' + DB.gapTypes.map(statCard).join("") + "</div>" +

      '<div class="grid-main-side">' +
      '<section class="panel"><div class="panel__head">' +
      '<div class="seg" data-role="seg">' +
      '<button data-gf="all" class="' + (filter === "all" ? "is-on" : "") + '">全部</button>' +
      '<button data-gf="open" class="' + (filter === "open" ? "is-on" : "") + '">待处理 ' + openCount + "</button>" +
      '<button data-gf="done" class="' + (filter === "done" ? "is-on" : "") + '">已入库</button>' +
      "</div>" +
      '<div class="spacer"></div>' +
      (isAdmin
        ? '<span class="chip chip--soft">' + ico("lock", 12) + "仅管理员可批准入库</span>"
        : '<span class="chip">' + ico("info", 12) + "标注员只能提报，不能直接改标准库</span>") +
      "</div>" +
      '<div class="tablewrap"><table class="tbl"><thead><tr>' +
      "<th>提报ID</th><th>类型</th><th>原始表达</th><th>建议标准实体</th><th>证据来源</th>" +
      "<th>提报说明</th><th>提报人 / 时间</th><th>状态</th><th>操作</th>" +
      "</tr></thead><tbody>" + (rows() ||
        '<tr><td colspan="9"><div class="empty">' + ico("checkCircle", 26) + "<b>没有待处理的提报</b><span>当前筛选下全部已入库</span></div></td></tr>") +
      "</tbody></table></div></section>" +

      '<aside class="stack-4 sticky">' +
      '<section class="panel"><div class="panel__head"><h3>提报状态流转</h3></div>' +
      '<div class="panel__body"><div class="flowcol">' +
      ["待审核", "审核通过 / 审核驳回", "待仲裁", "已入库"].map(function (s, i) {
        return '<div class="flowcol__i"><span class="dot" style="background:currentColor"></span>' + UI.status(s, statusOf(s)) +
          (i < 3 ? '<span class="flowcol__a"></span>' : "") + "</div>";
      }).join("") + "</div></div></section>" +

      '<section class="panel"><div class="panel__head"><h3>入库后发生什么</h3></div>' +
      '<div class="panel__body"><ol class="stepslist">' +
      "<li><b>标准库 / 别名库更新</b><span>写入新实体或别名映射，记录审核人与来源</span></li>" +
      "<li><b>生成新版本</b><span>别名库 V2.8 → V2.9，可回溯每条变化</span></li>" +
      "<li><b>同步标注平台与模型</b><span>后续样本直接可选，模型训练与线上标准化同步生效</span></li>" +
      "</ol></div></section>" +

      '<section class="panel"><div class="panel__head"><h3>最近一次版本变更</h3></div>' +
      '<div class="panel__body"><div class="vercard">' +
      '<div class="row row-2"><b class="mono">' + UI.esc(DB.versionLog[0].ver) + "</b>" +
      '<span class="chip chip--soft">' + UI.esc(DB.versionLog[0].asset) + "</span>" +
      '<div class="spacer"></div><span class="fs-11 muted">' + UI.esc(DB.versionLog[0].at) + "</span></div>" +
      '<p class="fs-12 muted-2">' + UI.esc(DB.versionLog[0].change) + "</p></div></div></section>" +
      "</aside></div></div>"
    );
  }

  function paint() {
    if (!root) return;
    root.innerHTML = render();
    bind();
  }

  function bind() {
    root.querySelectorAll("[data-gf]").forEach(function (b) {
      b.addEventListener("click", function () { filter = b.getAttribute("data-gf"); paint(); });
    });
    root.querySelectorAll("[data-newgap]").forEach(function (b) {
      b.addEventListener("click", function () { window.openGapReport({}, function () { paint(); }); });
    });
    root.querySelectorAll("[data-gap-ok]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-gap-ok");
        var g = Store.state.gaps.filter(function (x) { return x.id === id; })[0];
        UI.confirm({
          title: "通过并写入标准库？",
          body: "「" + g.raw + "」将映射到 " + g.suggest + "（" + g.suggestId + "），并计入下一个 " + DB.versions.alias + " 版本。",
          yes: "通过并入库",
          onYes: function () {
            Store.decideGap(id, "已入库", nextVer());
            UI.toast("已入库，等待发版", "ok");
            paint();
          }
        });
      });
    });
    root.querySelectorAll("[data-gap-no]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-gap-no");
        UI.confirm({
          title: "驳回该提报？", danger: true, yes: "驳回",
          body: "驳回必须说明原因，提报人可在「我的提报」中看到处理结果。",
          onYes: function () { Store.decideGap(id, "审核驳回"); UI.toast("已驳回提报", "warn"); paint(); }
        });
      });
    });
    root.querySelectorAll("[data-gap-rel]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-gap-rel");
        Store.decideGap(id, "已入库", nextVer());
        UI.toast("已发布新版本，标注平台与模型同步生效", "ok", 3200);
        paint();
      });
    });
  }

  function nextVer() {
    var parts = DB.versions.alias.replace("V", "").split(".");
    return "V" + parts[0] + "." + (parseInt(parts[1], 10) + 1);
  }

  /* ---------------- 提报弹窗（工作台复用） ---------------- */

  window.openGapReport = function (prefill, onSubmitted) {
    prefill = prefill || {};
    var typeId = prefill.type || "new_alias";
    var s = prefill.sample;

    function typeCards() {
      return '<div class="typecards">' + DB.gapTypes.map(function (t) {
        return '<button class="typecard typecard--pick' + (typeId === t.id ? " is-on" : "") + '" data-gaptype="' + t.id + '">' +
          '<div class="typecard__top"><b>' + UI.esc(t.label) + "</b>" +
          (typeId === t.id ? ico("check", 14) : "") + "</div><p>" + UI.esc(t.desc) + "</p></button>";
      }).join("") + "</div>";
    }

    var brandOpts = DB.brands.filter(function (b) { return b.status === "启用"; }).map(function (b) {
      return '<option value="' + b.id + '"' + (prefill.brandId === b.id ? " selected" : "") + ">" + UI.esc(b.cn + " " + b.en) + "</option>";
    }).join("");

    var html = UI.modal({
      size: "wide",
      title: "标准缺口提报",
      sub: "提报后会进入：审核 → 仲裁 → 入库 → 生成新版本 → 同步标注平台",
      body:
        '<div class="stack-4">' +
        '<div class="field"><span class="field__label">提报类型<span class="field__req">*</span></span>' +
        '<div data-typecards>' + typeCards() + "</div></div>" +

        '<div class="formgrid">' +
        UI.field({ label: "原始表达", req: true, hint: "内容中出现的原始写法",
          control: '<input class="input" id="gq-raw" value="' + UI.esc(prefill.raw || (s && s.gap ? s.gap.seriesMissing : "")) + '" placeholder="例如：毛豆Y / 台面奔 / 准新车" />' }) +
        UI.field({ label: "证据来源", req: true,
          control: '<select class="select" id="gq-src">' +
            ["ASR", "OCR", "标题", "Hashtag", "评论", "口语"].map(function (o) {
              return "<option>" + o + "</option>";
            }).join("") + "</select>" }) +
        UI.field({ label: "建议标准品牌", hint: "新别名 / 关系错误时填写",
          control: '<select class="select" id="gq-brand"><option value="">— 不涉及 —</option>' + brandOpts + "</select>" }) +
        UI.field({ label: "建议标准实体 / 车系", hint: "可直接输入新车系名称",
          control: '<input class="input" id="gq-std" value="' +
        UI.esc(typeId === "rule_gap" ? "市场类型判定规则" : (s && s.gap ? s.gap.seriesMissing : "")) +
            '" placeholder="例如：Model Y / AITO M8" />' }) +
        UI.field({ label: "内容ID", control: '<input class="input mono" id="gq-cid" value="' + UI.esc(s ? s.id : "—") + '" readonly />' }) +
        UI.field({ label: "截图 / 时间点", control: '<input class="input mono" id="gq-time" value="' + UI.esc(prefill.time || "00:32") + '" />' }) +
        "</div>" +

        UI.field({ label: "提报说明", req: true,
          control: '<textarea class="textarea" rows="3" id="gq-note" placeholder="说明为什么需要新增，例如出现频次、是否为稳定表达">' +
            UI.esc(prefill.note || "") + "</textarea>" }) +

        '<div class="formgrid formgrid--2">' +
        UI.field({ label: "提报人", control: '<input class="input" value="' +
          UI.esc((DB.roles.filter(function (r) { return r.id === Store.state.role; })[0] || {}).who || "annotator_001") + '" readonly />' }) +
        UI.field({ label: "提报后状态", control: '<input class="input" value="待审核" readonly />' }) +
        "</div>" +

        '<div class="banner banner--info">' + ico("info", 15) +
        "<span>标准库不会被标注员直接修改：<b>标注员发现 → 提报 → 质检 → 标准管理员审核 → 入库 → 产生新版本</b>。</span></div>" +
        "</div>",
      foot: '<span class="fs-12 muted" id="gq-err"></span><div class="spacer"></div>' +
        '<button class="btn btn--ghost" data-close>取消</button>' +
        '<button class="btn btn--primary" data-gq-submit>' + ico("flag", 15) + "提交提报</button>"
    });

    var scrim = html;
    var lastReport = null;

    scrim.querySelector("[data-typecards]").addEventListener("click", function (e) {
      var b = e.target.closest("[data-gaptype]");
      if (!b) return;
      typeId = b.getAttribute("data-gaptype");
      scrim.querySelector("[data-typecards]").innerHTML = typeCards();
      var std = scrim.querySelector("#gq-std");
      if (typeId === "rule_gap") std.value = "市场类型判定规则";
      if (typeId === "new_alias") std.value = "";
    });

    scrim.querySelector("[data-gq-submit]").addEventListener("click", function () {
      var raw = scrim.querySelector("#gq-raw").value.trim();
      var note = scrim.querySelector("#gq-note").value.trim();
      var err = scrim.querySelector("#gq-err");
      if (!raw) { err.textContent = "请填写原始表达"; err.style.color = "var(--danger)"; return; }
      if (!note) { err.textContent = "请填写提报说明"; err.style.color = "var(--danger)"; return; }
      var std = scrim.querySelector("#gq-std").value.trim();
      var brandId = scrim.querySelector("#gq-brand").value;
      var label = typeLabel(typeId);
      lastReport = Store.addGap({
        type: label,
        raw: raw,
        suggest: std || (label === "新别名" ? raw : "（待审核确认）"),
        suggestId: (brandId ? brandId + "_" : "") + (std ? std.toUpperCase().replace(/[^A-Z0-9]+/g, "_") : "PENDING"),
        source: scrim.querySelector("#gq-src").value,
        contentId: scrim.querySelector("#gq-cid").value || "—",
        time: scrim.querySelector("#gq-time").value || "—",
        note: note
      });
      scrim.remove();
      UI.toast("提报 " + lastReport.id + " 已提交，状态：待审核", "ok", 3200);
      if (onSubmitted) onSubmitted(lastReport);
    });
  };

  window.Views = window.Views || {};
  window.Views.gap = {
    title: "标准缺口提报",
    sub: "提报 → 审核 → 仲裁 → 入库 → 新版本",
    render: render,
    mount: function (r) { root = r; paint(); }
  };
})();
</script>
<script>
/* 质检页：判断标注结果是否符合统一标准 */
(function () {
  var ico = UI.ico;
  var root = null;
  var idx = 0;
  var reason = null;

  function list() { return Store.state.qc; }

  function diffRow(label, mine, std) {
    var same = mine === std;
    return "<li class=\"" + (same ? "is-same" : "is-diff") + "\">" +
      '<span class="cmp__k">' + UI.esc(label) + "</span>" +
      '<span class="cmp__mine">' + UI.esc(mine || "—") + "</span>" +
      '<span class="cmp__arrow">' + ico(same ? "check" : "arrowRight", 13) + "</span>" +
      '<span class="cmp__std">' + UI.esc(std || "—") + "</span></li>";
  }

  function detail(q) {
    if (!q) {
      return '<section class="panel"><div class="empty">' + ico("checkCircle", 26) +
        "<b>待质检队列已清空</b><span>当前抽检批次全部处理完成，可等待下一批样本进入</span></div></section>";
    }
    var market = DB.marketLabel;
    var sameMarket = q.result.market === q.standard.market;
    var sameBrand = q.result.brand === q.standard.brand;
    var sameSeries = (q.result.series || "") === (q.standard.series || "");
    var allSame = sameMarket && sameBrand && sameSeries && q.result.multi === q.standard.multi;

    return (
      '<div class="stack-3">' +
      '<section class="panel"><div class="panel__head">' +
      '<h2>' + UI.esc(q.title) + "</h2>" +
      '<div class="spacer"></div><span class="chip chip--mono">' + UI.esc(q.contentId) + "</span>" +
      "</div>" +
      '<div class="panel__body qcdetail">' +
      '<div class="qcframe">' + UI.carFrame({ body: "#DCE2EA", accent: "#7C4DE0" }) +
      '<span class="player__tc mono">00:12 / 01:12</span></div>' +
      '<div class="stack-3">' +
      '<div class="evi__block"><div class="evi__blockhead"><span class="evi__tag">ASR</span></div>' +
      '<p class="evi__text">' + UI.esc(q.asr) + "</p></div>" +
      '<div class="evi__meta">' +
      '<span class="evi__meta-i"><i>标注员</i><b>' + UI.esc(q.by) + "</b></span>" +
      '<span class="evi__meta-i"><i>提交时间</i><b>' + UI.esc(q.at) + "</b></span>" +
      '<span class="evi__meta-i"><i>任务</i><b>' + UI.esc(q.task) + "</b></span>" +
      "</div>" +
      '<div class="row row-2 wrap">' +
      '<span class="chip chip--mono">标准库 ' + DB.versions.taxonomy + "</span>" +
      '<span class="chip chip--mono">规则 ' + DB.versions.rule + "</span>" +
      '<span class="chip">双人标注：关闭 · 抽检 20%</span>' +
      "</div></div></div></section>" +

      '<div class="grid-2">' +
      '<section class="panel"><div class="panel__head"><h2>标注员结果</h2>' +
      '<div class="spacer"></div>' + UI.mark(q.result.market) + "</div>" +
      '<div class="panel__body stack-3">' +
      '<div class="kvlist">' +
      kv("市场类型", market[q.result.market]) +
      kv("品牌", q.result.brand ? DB.brandLabel(q.result.brand) : "—") +
      kv("车系", q.result.series ? DB.seriesLabel(q.result.series) : "UNKNOWN") +
      kv("多车", q.result.multi ? "是" : "否") +
      "</div>" +
      '<div class="banner banner--info">' + ico("info", 15) +
      "<span>标注员只能选择标准实体，不允许自由填写字符串。</span></div>" +
      "</div></section>" +

      '<section class="panel"><div class="panel__head"><h2>标准库预期</h2>' +
      '<div class="spacer"></div>' + UI.mark(q.standard.market) + "</div>" +
      '<div class="panel__body stack-3">' +
      '<ul class="cmp">' +
      diffRow("市场类型", market[q.result.market], market[q.standard.market]) +
      diffRow("品牌", q.result.brand ? DB.brandLabel(q.result.brand) : "", q.standard.brand ? DB.brandLabel(q.standard.brand) : "") +
      diffRow("车系", q.result.series ? DB.seriesLabel(q.result.series) : "UNKNOWN", q.standard.series ? DB.seriesLabel(q.standard.series) : "UNKNOWN") +
      diffRow("多车", q.result.multi ? "是" : "否", q.standard.multi ? "是" : "否") +
      "</ul>" +
      (allSame
        ? '<div class="banner banner--accent">' + ico("checkCircle", 15) + "<span><b>与标准库预期一致</b>，可直接通过。</span></div>"
        : '<div class="banner banner--warn">' + ico("gap", 15) + "<span><b>存在差异</b>：请判断是标注错误，还是标准库 / 规则需要更新。</span></div>") +
      "</div></section></div>" +

      '<section class="panel"><div class="panel__head"><h2>质检操作</h2>' +
      '<span class="panel__sub">驳回必须选择原因，用于统计标注错误主要发生在哪里</span></div>' +
      '<div class="panel__body stack-3">' +
      '<div class="field"><span class="field__label">驳回原因（驳回时必选）</span>' +
      '<div class="reasons">' + DB.qcReasons.map(function (r) {
        return '<button class="reason' + (reason === r ? " is-on" : "") + '" data-reason="' + UI.esc(r) + '">' + UI.esc(r) + "</button>";
      }).join("") + "</div></div>" +
      '<div class="row row-2 wrap">' +
      '<button class="btn btn--ok btn--lg" data-qc="pass">' + ico("check", 16) + "通过</button>" +
      '<button class="btn btn--danger btn--lg" data-qc="reject">' + ico("close", 16) + "驳回</button>" +
      '<button class="btn btn--ghost btn--lg" data-qc="edit">' + ico("sliders", 16) + "直接修改</button>" +
      '<button class="btn btn--ghost btn--lg" data-qc="arb">' + ico("arbitration", 16) + "提交仲裁</button>" +
      '<div class="spacer"></div>' +
      '<span class="fs-12 muted">' + (allSame ? "建议：通过" : "建议：核对规则后驳回或转仲裁") + "</span>" +
      "</div></div></section></div>"
    );
  }

  function kv(k, v) {
    return '<div class="kvlist__i"><span>' + UI.esc(k) + "</span><b>" + UI.esc(v) + "</b></div>";
  }

  function render() {
    var items = list();
    var q = items[idx] || null;
    var pending = items.filter(function (x) { return x.status === "待质检"; }).length;
    var passed = items.filter(function (x) { return x.status === "质检通过"; }).length;
    var rejected = items.filter(function (x) { return x.status === "已驳回"; }).length;
    var arb = items.filter(function (x) { return x.status === "转仲裁"; }).length;

    return (
      '<div class="vw stack-4">' +
      '<div class="vw__intro"><div><h2>质检</h2>' +
      "<p>抽检比例 20%，低置信样本 100% 全检；标注员与质检员冲突时进入仲裁。</p></div>" +
      '<div class="row row-2">' +
      '<button class="btn btn--ghost" data-bulk>' + ico("checkCircle", 15) + "批量通过一致项</button>" +
      "</div></div>" +

      '<div class="statstrip">' +
      qs("待质检", pending, true) + qs("已通过", passed) + qs("已驳回", rejected) + qs("转仲裁", arb) +
      "</div>" +

      '<div class="splitpane">' +
      '<section class="panel queuelist"><div class="panel__head"><h2>抽检队列</h2>' +
      '<div class="spacer"></div><span class="chip">' + items.length + " 条</span></div>" +
      '<ul class="qlist">' + items.map(function (x, i) {
        var st = x.status;
        var cls = st === "待质检" ? "status--pending" : st === "质检通过" ? "status--done" :
          st === "已驳回" ? "status--reject" : "status--arb";
        return '<li><button class="qitem' + (i === idx ? " is-on" : "") + '" data-q="' + i + '">' +
          '<span class="qitem__top"><span class="mono fs-11 muted">' + UI.esc(x.contentId) + "</span>" +
          UI.status(st, cls) + "</span>" +
          '<span class="qitem__t">' + UI.esc(x.title) + "</span>" +
          '<span class="qitem__m">' + UI.esc(x.by) + " · " + UI.esc(x.at) + "</span></button></li>";
      }).join("") + "</ul></section>" +
      '<div class="splitpane__main">' + detail(q) + "</div>" +
      "</div></div>"
    );
  }

  function qs(label, v, accent) {
    return '<div class="statstrip__i' + (accent ? " is-accent" : "") + '">' +
      '<span class="fs-12 muted">' + label + "</span><b class=\"num\">" + v + "</b></div>";
  }

  function paint() {
    if (!root) return;
    root.innerHTML = render();
    bind();
  }

  function bind() {
    root.querySelectorAll("[data-q]").forEach(function (b) {
      b.addEventListener("click", function () { idx = parseInt(b.getAttribute("data-q"), 10); reason = null; paint(); });
    });
    root.querySelectorAll("[data-reason]").forEach(function (b) {
      b.addEventListener("click", function () { reason = b.getAttribute("data-reason"); paint(); });
    });
    root.querySelectorAll("[data-qc]").forEach(function (b) {
      b.addEventListener("click", function () { act(b.getAttribute("data-qc")); });
    });
    var bulk = root.querySelector("[data-bulk]");
    if (bulk) bulk.addEventListener("click", function () {
      var ids = list().filter(function (x) {
        return x.status === "待质检" && x.result.market === x.standard.market &&
          x.result.brand === x.standard.brand && x.result.multi === x.standard.multi;
      }).map(function (x) { return x.id; });
      if (!ids.length) { UI.toast("没有找到结果一致的样本", "info"); return; }
      Store.qcBulkPass(ids);
      UI.toast("已批量通过 " + ids.length + " 条一致样本", "ok");
      var items = list();
      var next = items.findIndex(function (x) { return x.status === "待质检"; });
      idx = next < 0 ? 0 : next;
      paint();
    });
  }

  function act(kind) {
    var items = list();
    var q = items[idx];
    if (!q || q.status !== "待质检") { UI.toast("该样本已处理", "info"); return; }
    if (kind === "pass") {
      Store.qcDecide(q.id, "pass");
      UI.toast("样本 " + q.contentId + " 质检通过", "ok");
      advance();
      return;
    }
    if (kind === "reject") {
      if (!reason) { UI.toast("驳回前必须选择原因", "warn"); return; }
      Store.qcDecide(q.id, "reject", reason);
      UI.toast("已驳回：" + reason + "，已计入质检错误统计", "warn", 3200);
      reason = null;
      advance();
      return;
    }
    if (kind === "arb") {
      Store.qcDecide(q.id, "arb", reason || "标注结果与标准库预期不一致");
      UI.toast("已提交仲裁，等待仲裁员最终判定", "info", 3200);
      reason = null;
      advance();
      return;
    }
    if (kind === "edit") {
      UI.modal({
        size: "narrow",
        title: "直接修改标注结果",
        sub: "修改会记录：谁、什么时间、从什么值、改成什么值、为什么改",
        body: '<div class="stack-3">' +
          UI.field({ label: "市场类型", control: '<select class="select" id="ed-m">' +
            ["NEW", "USED", "MIXED", "UNKNOWN", "NON_TRANSACTION"].map(function (m) {
              return '<option value="' + m + '"' + (q.result.market === m ? " selected" : "") + ">" + m + " · " + DB.marketLabel[m] + "</option>";
            }).join("") + "</select>" }) +
          UI.field({ label: "品牌", control: '<select class="select" id="ed-b">' +
            DB.brands.filter(function (b) { return b.status === "启用"; }).map(function (b) {
              return '<option value="' + b.id + '"' + (q.result.brand === b.id ? " selected" : "") + ">" + UI.esc(b.cn + " " + b.en) + "</option>";
            }).join("") + "</select>" }) +
          UI.field({ label: "车系", control: '<select class="select" id="ed-s">' +
            DB.series.map(function (x) {
              return '<option value="' + x.id + '"' + (q.result.series === x.id ? " selected" : "") + ">" +
                UI.esc(DB.brandLabel(x.brand) + " " + x.name) + "</option>";
            }).join("") + "</select>" }) +
          UI.field({ label: "修改原因", control: '<textarea class="textarea" rows="2" id="ed-r" placeholder="例如：命中规则 13.6 准新车记 USED"></textarea>' }) +
          "</div>",
        foot: '<div class="spacer"></div><button class="btn btn--ghost" data-close>取消</button>' +
          '<button class="btn btn--primary" data-ed-ok>保存并质检通过</button>'
      }).querySelector("[data-ed-ok]").addEventListener("click", function (e) {
        var scrim = e.target.closest(".scrim");
        var m = scrim.querySelector("#ed-m").value;
        var b = scrim.querySelector("#ed-b").value;
        var s = scrim.querySelector("#ed-s").value;
        Store.log("质检修改标注", q.contentId, q.result.market + " / " + q.result.brand, m + " / " + b + " / " + s);
        q.result = { transaction: "yes", market: m, brand: b, series: s, multi: q.result.multi };
        Store.qcDecide(q.id, "pass");
        scrim.remove();
        UI.toast("已修改并记录变更留痕", "ok");
        advance();
      });
    }
  }

  function advance() {
    var items = list();
    for (var i = 0; i < items.length; i++) {
      if (items[i].status === "待质检") { idx = i; paint(); return; }
    }
    idx = items.length ? 0 : 0;
    paint();
  }

  window.Views = window.Views || {};
  window.Views.quality = {
    title: "质检",
    sub: "检查标注结果是否符合统一标准",
    render: render,
    mount: function (r) { root = r; paint(); }
  };
})();
</script>
<script>
/* 仲裁页：争议样本的最终判定 = Final Ground Truth */
(function () {
  var ico = UI.ico;
  var root = null;
  var idx = 0;
  var pick = null;
  var note = "";

  function list() { return Store.state.arb; }

  function claimCard(a, i, resolved) {
    var on = pick === i;
    return '<button class="claim' + (on ? " is-on" : "") + (resolved ? " is-locked" : "") + '" data-claim="' + i + '">' +
      '<span class="claim__head"><span class="claim__avatar" style="background:' + a.tone + '">' +
      UI.esc(a.role.slice(0, 1)) + "</span>" +
      '<span class="claim__role">' + UI.esc(a.role) + '<i class="mono">' + UI.esc(a.who) + "</i></span>" +
      (on ? '<span class="claim__pick">' + ico("check", 13) + "</span>" : "") + "</span>" +
      '<span class="claim__val">' + UI.esc(a.val) + "</span>" +
      '<span class="claim__ent">' + UI.esc(a.brand) + " · " + UI.esc(a.series) + "</span></button>";
  }

  function detail(a) {
    if (!a) {
      return '<section class="panel"><div class="empty">' + ico("checkCircle", 26) +
        "<b>仲裁队列已清空</b><span>所有争议样本均已给出最终标签</span></div></section>";
    }
    var resolved = a.status === "已仲裁";
    return (
      '<div class="stack-3">' +
      '<section class="panel"><div class="panel__head">' +
      '<h2>' + UI.esc(a.title) + "</h2><div class=\"spacer\"></div>" +
      '<span class="chip chip--mono">' + UI.esc(a.contentId) + "</span>" +
      '<span class="chip">' + UI.esc(a.task) + "</span></div>" +
      '<div class="panel__body qcdetail">' +
      '<div class="qcframe">' + UI.carFrame({ body: "#E3E6EB", accent: "#C2760B" }) +
      '<span class="player__tc mono">00:24 / 01:36</span></div>' +
      '<div class="stack-3">' +
      '<div class="evi__block"><div class="evi__blockhead"><span class="evi__tag">ASR</span></div>' +
      '<p class="evi__text">' + UI.esc(a.asr) + "</p></div>" +
      '<div class="banner banner--warn">' + ico("arbitration", 15) +
      "<span><b>争议原因：</b>" + UI.esc(a.reason) + "</span></div>" +
      '<div class="row row-2 wrap">' +
      '<span class="chip chip--mono">标准库 ' + DB.versions.taxonomy + "</span>" +
      '<span class="chip chip--mono">规则 ' + DB.versions.rule + "</span>" +
      '<span class="fs-12 muted">开启于 ' + UI.esc(a.open) + "</span>" +
      "</div></div></div></section>" +

      '<section class="panel"><div class="panel__head"><h2>各方结果</h2>' +
      '<span class="panel__sub">仲裁结果即为 Final Ground Truth，写入训练数据</span></div>' +
      '<div class="panel__body">' +
      '<div class="claims">' + a.claims.map(function (c, i) { return claimCard(c, i, resolved); }).join("") + "</div>" +
      (resolved
        ? '<div class="banner banner--accent" style="margin-top:12px">' + ico("checkCircle", 15) +
          "<span><b>已仲裁：</b>最终标签 " + UI.esc(a.final) + "，已记录仲裁员与时间，可回溯。</span></div>"
        : "") +
      "</div></section>" +

      '<section class="panel"><div class="panel__head"><h2>最终判定</h2>' +
      '<div class="spacer"></div>' +
      (resolved ? UI.status("已仲裁", "status--done") : UI.status("待仲裁", "status--arb")) +
      "</div>" +
      '<div class="panel__body stack-3">' +
      (resolved
        ? '<div class="kvlist">' +
          '<div class="kvlist__i"><span>最终标签</span><b>' + UI.esc(a.final) + "</b></div>" +
          '<div class="kvlist__i"><span>判定人</span><b>' + UI.esc((DB.roles.filter(function (r) { return r.id === "arbiter"; })[0] || {}).who || "arb_003") + "</b></div>" +
          '<div class="kvlist__i"><span>写入</span><b>最终标签 · 训练数据</b></div>' +
          "</div>" +
          '<button class="btn btn--ghost btn--block" data-next>处理下一条争议样本</button>'
        : '<div class="field"><span class="field__label">选择最终结果<span class="field__req">*</span></span>' +
          '<div class="optlist">' + a.claims.map(function (c, i) {
            return '<label class="radio' + (pick === i ? " is-on" : "") + '">' +
              '<input type="radio" name="pick" data-pick="' + i + '"' + (pick === i ? " checked" : "") + " />" +
              '<span class="radio__dot"></span><span class="radio__text">' + UI.esc(c.role) + " · " + UI.esc(c.val) +
              '<span class="radio__note">' + UI.esc(c.brand + " · " + c.series) + "</span></span></label>";
          }).join("") + "</div></div>" +
          UI.field({ label: "判定依据", hint: "引用标注规范或标准库条目",
            control: '<textarea class="textarea" rows="2" data-arb-note placeholder="例如：命中规则 13.2 主车判定，视频主体为 Q5L">' + UI.esc(note) + "</textarea>" }) +
          '<div class="row row-2">' +
          '<button class="btn btn--primary btn--lg" data-arb-ok>' + ico("check", 16) + "确认为 Final Ground Truth</button>" +
          '<button class="btn btn--ghost btn--lg" data-arb-gap>' + ico("flag", 16) + "同步发起标准提报</button>" +
          "</div>") +
      "</div></section></div>"
    );
  }

  function render() {
    var items = list();
    var a = items[idx] || null;
    var pending = items.filter(function (x) { return x.status !== "已仲裁"; }).length;
    var done = items.filter(function (x) { return x.status === "已仲裁"; }).length;

    return (
      '<div class="vw stack-4">' +
      '<div class="vw__intro"><div><h2>仲裁</h2>' +
      "<p>标注员之间、标注员与质检员之间、或规则未覆盖的争议，由仲裁员给出最终标签。</p></div>" +
      '<span class="chip chip--soft">' + ico("lock", 12) + "仲裁结果不可被标注员覆盖</span></div>" +

      '<div class="statstrip">' + qs("待仲裁", pending, true) + qs("已仲裁", done) +
      '<div class="statstrip__i"><span class="fs-12 muted">仲裁率</span><b class="num">0.64%</b></div>' +
      '<div class="statstrip__i"><span class="fs-12 muted">平均处理时长</span><b class="num">4.2h</b></div>' +
      "</div>" +

      '<div class="splitpane">' +
      '<section class="panel queuelist"><div class="panel__head"><h2>争议队列</h2>' +
      '<div class="spacer"></div><span class="chip">' + items.length + " 条</span></div>" +
      '<ul class="qlist">' + items.map(function (x, i) {
        var cls = x.status === "已仲裁" ? "status--done" : "status--arb";
        return '<li><button class="qitem' + (i === idx ? " is-on" : "") + '" data-a="' + i + '">' +
          '<span class="qitem__top"><span class="mono fs-11 muted">' + UI.esc(x.contentId) + "</span>" +
          UI.status(x.status || "待仲裁", cls) + "</span>" +
          '<span class="qitem__t">' + UI.esc(x.title) + "</span>" +
          '<span class="qitem__m">' + UI.esc(x.reason) + "</span></button></li>";
      }).join("") + "</ul></section>" +
      '<div class="splitpane__main">' + detail(a) + "</div>" +
      "</div></div>"
    );
  }

  function qs(label, v, accent) {
    return '<div class="statstrip__i' + (accent ? " is-accent" : "") + '">' +
      '<span class="fs-12 muted">' + label + '</span><b class="num">' + v + "</b></div>";
  }

  function paint() {
    if (!root) return;
    root.innerHTML = render();
    bind();
  }

  function bind() {
    root.querySelectorAll("[data-a]").forEach(function (b) {
      b.addEventListener("click", function () { idx = parseInt(b.getAttribute("data-a"), 10); pick = null; note = ""; paint(); });
    });
    root.querySelectorAll("[data-claim]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (list()[idx].status === "已仲裁") return;
        pick = parseInt(b.getAttribute("data-claim"), 10);
        paint();
      });
    });
    root.querySelectorAll("[data-pick]").forEach(function (el) {
      el.addEventListener("change", function () { pick = parseInt(el.getAttribute("data-pick"), 10); paint(); });
    });
    var nt = root.querySelector("[data-arb-note]");
    if (nt) {
      nt.addEventListener("input", function () { note = nt.value; });
    }
    var ok = root.querySelector("[data-arb-ok]");
    if (ok) ok.addEventListener("click", function () {
      if (pick == null) { UI.toast("请先选择最终结果", "warn"); return; }
      var a = list()[idx];
      Store.arbDecide(a.id, pick, note);
      if (note) {
        var last = Store.state.activity[0];
        if (last) last.to = answer(a) + " · " + note;
      }
      UI.toast("已写入 Final Ground Truth，后续训练数据以该结果为准", "ok", 3400);
      pick = null; note = "";
      paint();
    });
    var gap = root.querySelector("[data-arb-gap]");
    if (gap) gap.addEventListener("click", function () {
      var a = list()[idx];
      window.openGapReport({ type: "", raw: "", note: a.reason }, function () { paint(); });
    });
    var nx = root.querySelector("[data-next]");
    if (nx) nx.addEventListener("click", function () {
      var items = list();
      for (var i = 0; i < items.length; i++) {
        if (items[i].status !== "已仲裁") { idx = i; pick = null; note = ""; paint(); return; }
      }
      UI.toast("所有争议样本已处理完成", "ok");
    });
  }

  function answer(a) {
    var c = a.claims.filter(function (x) { return x; });
    return a.final || (c[0] ? c[0].brand + " / " + c[0].series : "UNKNOWN");
  }

  window.Views = window.Views || {};
  window.Views.arbitration = {
    title: "仲裁",
    sub: "处理争议样本，产出 Final Ground Truth",
    render: render,
    mount: function (r) { root = r; pick = null; note = ""; paint(); }
  };
})();
</script>
<script>
/* 标准库 / 别名库管理：标准资产只能由管理员批准入库 */
(function () {
  var ico = UI.ico;
  var root = null;
  var tab = "brand";
  var q = "";

  var TABS = [
    { id: "brand", t: "标准品牌库", n: function () { return DB.brands.length; } },
    { id: "series", t: "标准车系库", n: function () { return DB.series.length; } },
    { id: "alias", t: "别名库", n: function () { return Store.state.aliases.length; } },
    { id: "review", t: "提报审核", n: function () { return Store.state.gaps.filter(function (g) { return g.status === "待审核" || g.status === "待仲裁"; }).length; } },
    { id: "version", t: "版本记录", n: function () { return DB.versionLog.length; } }
  ];

  function hit(text) { return !q || String(text).toLowerCase().indexOf(q.toLowerCase()) !== -1; }

  function brandTable() {
    var rows = DB.brands.filter(function (b) { return hit(b.id + b.cn + b.en); }).map(function (b) {
      var n = DB.seriesOf(b.id).length;
      return "<tr><td class=\"mono strong\">" + UI.esc(b.id) + "</td>" +
        '<td class="strong">' + UI.esc(b.cn) + "</td>" +
        '<td class="muted-2">' + UI.esc(b.en) + "</td>" +
        '<td class="right num">' + n + "</td>" +
        "<td>" + UI.status(b.status, b.status === "启用" ? "status--done" : "status--wait") + "</td>" +
        '<td class="muted">' + UI.esc(b.at) + "</td>" +
        '<td><span class="chip chip--mono">' + UI.esc(b.ver) + "</span></td>" +
        '<td><div class="row-actions"><button class="btn btn--sm btn--quiet" data-t="edit">' + ico("sliders", 14) + "</button>" +
        '<button class="btn btn--sm btn--quiet" data-t="more">' + ico("more", 14) + "</button></div></td></tr>";
    }).join("");
    return table(["brand_id", "品牌中文名", "品牌英文名", "车系数", "状态", "创建时间", "版本", "操作"], rows,
      '<th class="right">车系数</th>');
  }

  function seriesTable() {
    var rows = DB.series.filter(function (s) { return hit(s.id + s.name + DB.brandLabel(s.brand)); }).map(function (s) {
      return '<tr><td class="mono strong">' + UI.esc(s.id) + "</td>" +
        '<td class="strong">' + UI.esc(s.name) + "</td>" +
        "<td>" + UI.trace(UI.esc(s.name), DB.brandLabel(s.brand)) + "</td>" +
        '<td class="muted-2">' + UI.esc(s.at) + "</td>" +
        "<td>" + UI.status(s.status, "status--done") + "</td>" +
        '<td><div class="row-actions"><button class="btn btn--sm btn--quiet" data-t="edit">' + ico("sliders", 14) + "</button></div></td></tr>";
    }).join("");
    return table(["series_id", "车系名", "所属品牌", "创建时间", "状态", "操作"], rows);
  }

  function aliasTable() {
    var rows = Store.state.aliases.filter(function (a) { return hit(a.alias + a.target + a.source); }).map(function (a) {
      var label = a.type === "brand" ? DB.brandLabel(a.target) : a.type === "rule" ? "标注规则" : DB.seriesLabel(a.target);
      var cls = a.status === "已入库" ? "status--done" : a.status === "待审核" ? "status--pending" : "status--arb";
      return "<tr>" +
        '<td class="strong">' + UI.esc(a.alias) + "</td>" +
        "<td>" + UI.trace(UI.esc(a.alias), label || a.target) + "</td>" +
        '<td><span class="chip">' + UI.esc(a.source) + "</span></td>" +
        '<td class="muted-2">' + UI.esc(a.by) + "</td>" +
        '<td class="muted num">' + UI.esc(a.at) + "</td>" +
        '<td class="right num">' + UI.num(a.hits) + "</td>" +
        '<td><span class="chip chip--mono">' + UI.esc(a.ver) + "</span></td>" +
        "<td>" + UI.status(a.status, cls) + "</td></tr>";
    }).join("");
    return table(["原始表达", "标准实体", "来源", "审核人", "创建时间", "命中次数", "版本", "状态"], rows);
  }

  function reviewTable() {
    var gaps = Store.state.gaps.filter(function (g) { return hit(g.id + g.raw + g.suggest); });
    if (!gaps.length) {
      return '<div class="empty">' + ico("checkCircle", 26) + "<b>没有提报记录</b><span>标注员在工作台发起的缺口提报会出现在这里</span></div>";
    }
    return '<div class="tablewrap"><table class="tbl"><thead><tr>' +
      "<th>提报ID</th><th>类型</th><th>原始表达</th><th>建议标准实体</th><th>证据</th><th>提报人</th><th>状态</th><th>操作</th>" +
      "</tr></thead><tbody>" + gaps.map(function (g) {
        var cls = DB.gapStatusMeta[g.status] || "status--wait";
        var act = (g.status === "待审核" || g.status === "待仲裁")
          ? '<div class="row-actions"><button class="btn btn--sm btn--primary" data-ok="' + g.id + '">通过入库</button>' +
            '<button class="btn btn--sm btn--ghost" data-no="' + g.id + '">驳回</button>' +
            '<button class="btn btn--sm btn--quiet" data-arb="' + g.id + '">转仲裁</button></div>'
          : '<span class="fs-12 muted">已处理</span>';
        return "<tr><td class=\"mono fs-12 muted\">" + UI.esc(g.id) + "</td>" +
          '<td><span class="chip">' + UI.esc(g.type) + "</span></td>" +
          '<td class="strong">' + UI.esc(g.raw) + "</td>" +
          "<td>" + UI.trace(UI.esc(g.raw), UI.esc(g.suggest)) + "</td>" +
          '<td class="muted-2"><span class="chip">' + UI.esc(g.source) + '</span> <span class="mono fs-11">' + UI.esc(g.contentId) + "</span></td>" +
          '<td class="muted-2">' + UI.esc(g.by) + "<br /><span class=\"fs-11\">" + UI.esc(g.at) + "</span></td>" +
          "<td>" + UI.status(g.status, cls) + "</td><td>" + act + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function versionTable() {
    return '<div class="tablewrap"><table class="tbl"><thead><tr>' +
      "<th>版本</th><th>资产</th><th>变更内容</th><th class=\"right\">条目</th><th>时间</th><th>操作人</th><th>影响面</th>" +
      "</tr></thead><tbody>" + DB.versionLog.map(function (v) {
        return '<tr><td class="mono strong">' + UI.esc(v.ver) + "</td>" +
          "<td>" + UI.esc(v.asset) + "</td>" +
          '<td class="muted-2">' + UI.esc(v.change) + "</td>" +
          '<td class="right num">' + v.count + "</td>" +
          '<td class="muted num">' + UI.esc(v.at) + "</td>" +
          '<td class="muted">' + UI.esc(v.by) + "</td>" +
          '<td class="muted">' + UI.esc(v.impact) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }

  function table(heads, rows, extraHead) {
    if (!rows) {
      return '<div class="empty">' + ico("search", 26) + "<b>没有匹配的条目</b><span>换个关键词试试</span></div>";
    }
    return '<div class="tablewrap"><table class="tbl"><thead><tr>' +
      heads.map(function (h, i) {
        var cls = (h.indexOf("数") !== -1 || h.indexOf("次数") !== -1) ? ' class="right"' : "";
        return "<th" + cls + ">" + UI.esc(h) + "</th>";
      }).join("") + "</tr></thead><tbody>" + rows + "</tbody></table></div>";
  }

  function body() {
    if (tab === "brand") return brandTable();
    if (tab === "series") return seriesTable();
    if (tab === "alias") return aliasTable();
    if (tab === "review") return reviewTable();
    return versionTable();
  }

  function render() {
    var isAdmin = Store.state.role === "admin";
    var T = TABS.filter(function (t) { return t.id === tab; })[0] || TABS[0];
    return (
      '<div class="vw stack-4">' +
      '<div class="vw__intro"><div><h2>标准库与别名库</h2>' +
      "<p>标准库不能被任何标注员直接修改；所有变化必须经过提报、审核、发版。</p></div>" +
      (isAdmin
        ? '<div class="row row-2">' +
          '<button class="btn btn--ghost" data-new>' + ico("plus", 15) + "新增条目</button>" +
          '<button class="btn btn--ghost" data-export>' + ico("download", 15) + "导出版本</button>" +
          "</div>"
        : '<span class="chip chip--soft">' + ico("lock", 12) + "只读：需要变更请发起提报</span>") +
      "</div>" +

      '<div class="verbar">' +
      '<span class="verbar__i"><i>标准库</i><b class="mono">' + DB.versions.taxonomy + "</b></span>" +
      '<span class="verbar__i"><i>别名库</i><b class="mono">' + DB.versions.alias + "</b></span>" +
      '<span class="verbar__i"><i>规则</i><b class="mono">' + DB.versions.rule + "</b></span>" +
      '<span class="verbar__i"><i>最近发版</i><b>' + UI.esc(DB.versionLog[0].at) + "</b></span>" +
      '<div class="spacer"></div>' +
      '<span class="fs-12 muted">标注结果必须可追溯：' + DB.versions.taxonomy + " / " + DB.versions.alias + " / " + DB.versions.rule + "</span>" +
      "</div>" +

      '<section class="panel">' +
      '<div class="panel__head">' +
      '<div class="tabs" data-tabs>' + TABS.map(function (t) {
        return '<button class="tab' + (tab === t.id ? " is-on" : "") + '" data-tab="' + t.id + '">' +
          UI.esc(t.t) + '<span class="tab__n num">' + t.n() + "</span></button>";
      }).join("") + "</div>" +
      '<div class="spacer"></div>' +
      '<div class="search" style="width:230px">' + ico("search", 15) +
      '<input class="input" data-tq placeholder="搜索 ' + UI.esc(T.t) + '" value="' + UI.esc(q) + '" /></div>' +
      "</div>" + body() + "</section></div>"
    );
  }

  function paint() {
    if (!root) return;
    var key = null;
    var el = root.querySelector("[data-tq]");
    if (el && document.activeElement === el) key = el.selectionStart;
    root.innerHTML = render();
    bind();
    if (key != null) {
      var next = root.querySelector("[data-tq]");
      if (next) { next.focus(); try { next.setSelectionRange(key, key); } catch (e) { } }
    }
  }

  function bind() {
    root.querySelectorAll("[data-tab]").forEach(function (b) {
      b.addEventListener("click", function () { tab = b.getAttribute("data-tab"); q = ""; paint(); });
    });
    var s = root.querySelector("[data-tq]");
    if (s) {
      s.addEventListener("input", function () { q = s.value; paint(); });
      s.addEventListener("focus", function () { });
    }
    root.querySelectorAll("[data-ok]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-ok");
        var g = Store.state.gaps.filter(function (x) { return x.id === id; })[0];
        UI.confirm({
          title: "通过并写入标准库？",
          body: "「" + g.raw + "」→ " + g.suggest + "。入库后别名库版本将递增，标注平台与模型同步生效。",
          yes: "通过并入库",
          onYes: function () {
            Store.decideGap(id, "已入库", "V2." + (parseInt(DB.versions.alias.split(".")[1], 10) + 1));
            UI.toast("已入库 · 标注平台与模型同步生效", "ok");
            paint();
          }
        });
      });
    });
    root.querySelectorAll("[data-no]").forEach(function (b) {
      b.addEventListener("click", function () {
        Store.decideGap(b.getAttribute("data-no"), "审核驳回");
        UI.toast("已驳回", "warn");
        paint();
      });
    });
    root.querySelectorAll("[data-arb]").forEach(function (b) {
      b.addEventListener("click", function () {
        Store.decideGap(b.getAttribute("data-arb"), "待仲裁");
        UI.toast("已提交仲裁", "info");
        paint();
      });
    });
    var nx = root.querySelector("[data-new]");
    if (nx) nx.addEventListener("click", function () {
      UI.toast("新增标准条目：走提报 → 审核 → 入库流程，不允许直接写入", "info", 3200);
    });
    var ex = root.querySelector("[data-export]");
    if (ex) ex.addEventListener("click", function () {
      UI.download("taxonomy_" + DB.versions.taxonomy + "_" + DB.versions.alias + ".json",
        JSON.stringify({ taxonomy_version: DB.versions.taxonomy, alias_version: DB.versions.alias, rule_version: DB.versions.rule, brands: DB.brands, series: DB.series, aliases: Store.state.aliases }, null, 2));
      UI.toast("已导出标准库与别名库（JSON）", "ok");
    });
  }

  window.Views = window.Views || {};
  window.Views.taxonomy = {
    title: "标准库与别名库",
    sub: "标准资产治理：提报 → 审核 → 入库 → 发版",
    render: render,
    mount: function (r) { root = r; paint(); }
  };
})();
</script>
<script>
/* App shell: rail navigation, topbar, role switcher, router. */
(function () {
  var ico = UI.ico;
  var railNav = document.getElementById("rail-nav");
  var topbar = document.getElementById("topbar");
  var viewHost = document.getElementById("view");
  var verbox = document.getElementById("verbox");
  var rolebox = document.getElementById("rolebox");

  var lastRoute = null;
  var lastRole = null;
  var menuOpen = false;

  var NAV = [
    { group: "工作台", items: [
      { id: "overview", label: "概览", icon: "overview", roles: ["annotator", "qcer", "arbiter", "admin"] },
      { id: "tasks", label: "任务列表", icon: "tasks", roles: ["annotator", "qcer", "arbiter", "admin"], badge: function () { return pendingTasks(); } },
      { id: "create", label: "任务创建", icon: "create", roles: ["admin"] },
      { id: "workbench", label: "标注工作台", icon: "workbench", roles: ["annotator", "admin"] }
    ] },
    { group: "质量与治理", items: [
      { id: "quality", label: "质检", icon: "quality", roles: ["qcer", "admin"], badge: function () { return countQc(); } },
      { id: "arbitration", label: "仲裁", icon: "arbitration", roles: ["arbiter", "admin"], badge: function () { return countArb(); } },
      { id: "gap", label: "标准缺口提报", icon: "gap", roles: ["annotator", "qcer", "arbiter", "admin"], badge: function () { return countGaps(); } },
      { id: "taxonomy", label: "标准库与别名库", icon: "taxonomy", roles: ["admin"] }
    ] }
  ];

  function role() { return Store.state.role; }

  function pendingTasks() {
    var r = role();
    return Store.state.tasks.filter(function (t) {
      if (r === "qcer") return t.qc > 0;
      if (r === "arbiter") return t.arb > 0;
      if (r === "admin") return t.status === "待领取" || t.status === "待仲裁清理";
      return t.status === "待领取" || (t.status === "进行中" && t.done < t.total);
    }).length;
  }
  function countQc() { return Store.state.qc.filter(function (q) { return q.status === "待质检"; }).length; }
  function countArb() { return Store.state.arb.filter(function (a) { return a.status !== "已仲裁"; }).length; }
  function countGaps() {
    return Store.state.gaps.filter(function (g) {
      return role() === "admin" ? (g.status === "待审核" || g.status === "待仲裁") : g.status === "待审核";
    }).length;
  }

  function renderRail() {
    var r = role();
    railNav.innerHTML = NAV.map(function (g) {
      var items = g.items.filter(function (i) { return i.roles.indexOf(r) !== -1; });
      if (!items.length) return "";
      return '<div class="rail__group">' + g.group + "</div>" + items.map(function (i) {
        var n = i.badge ? i.badge() : 0;
        return '<button class="navitem' + (Store.state.route === i.id ? " is-active" : "") + '" data-nav="' + i.id + '">' +
          ico(i.icon, 16) + '<span class="navitem__label">' + i.label + "</span>" +
          (n ? '<span class="navitem__badge' + (i.id === "arbitration" ? " is-alert" : "") + '">' + n + "</span>" : "") +
          "</button>";
      }).join("");
    }).join("");

    railNav.querySelectorAll("[data-nav]").forEach(function (b) {
      b.addEventListener("click", function () { Store.go(b.getAttribute("data-nav")); });
    });

    verbox.innerHTML =
      '<span class="ver">标准库 <b>' + DB.versions.taxonomy + "</b></span>" +
      '<span class="ver">别名库 <b>' + DB.versions.alias + "</b></span>" +
      '<span class="ver">规则 <b>' + DB.versions.rule + "</b></span>";

    var cur = DB.roles.filter(function (x) { return x.id === r; })[0] || DB.roles[0];
    rolebox.innerHTML =
      '<button class="rolebtn" data-roletoggle aria-haspopup="true" aria-expanded="' + menuOpen + '">' +
      '<span class="avatar" style="background:' + cur.tone + '">' + cur.name.slice(0, 1) + "</span>" +
      '<span class="rolebtn__text"><b>' + cur.name + "</b><i>" + UI.esc(cur.who) + "</i></span>" +
      ico("chevronDown", 14) + "</button>" +
      '<div class="rolemenu' + (menuOpen ? " is-open" : "") + '" role="menu">' +
      DB.roles.map(function (x) {
        return '<button class="rolemenu__item' + (x.id === r ? " is-on" : "") + '" data-role="' + x.id + '">' +
          '<span class="avatar" style="background:' + x.tone + ';width:22px;height:22px;border-radius:6px;font-size:10px">' +
          x.name.slice(0, 1) + "</span><span><b style=\"font-size:12px\">" + x.name + "</b><em>" + UI.esc(x.scope) + "</em></span>" +
          (x.id === r ? ico("check", 14) : "") + "</button>";
      }).join("") + "</div>";

    rolebox.querySelector("[data-roletoggle]").addEventListener("click", function () {
      menuOpen = !menuOpen;
      renderRail();
    });
    rolebox.querySelectorAll("[data-role]").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = b.getAttribute("data-role");
        menuOpen = false;
        if (id === role()) { renderRail(); return; }
        Store.setRole(id);
        var r2 = DB.roles.filter(function (x) { return x.id === id; })[0];
        UI.toast("已切换到「" + r2.name + "」，权限范围：" + r2.scope, "info", 3000);
      });
    });
  }

  function renderTopbar(view) {
    topbar.innerHTML =
      '<div class="topbar__title"><h1>' + UI.esc(view.title) + "</h1><p>" + UI.esc(view.sub || "") + "</p></div>" +
      '<div class="topbar__spacer"></div>' +
      '<div class="syncchip">' + ico("pulse", 14) + "<span>标准库同步正常</span>" +
      '<b class="mono">' + DB.versions.taxonomy + " / " + DB.versions.alias + " / " + DB.versions.rule + "</b></div>" +
      '<button class="btn btn--ghost btn--sm" data-top-export>' + ico("download", 14) + "导出最终标签</button>";
    topbar.querySelector("[data-top-export]").addEventListener("click", doExport);
  }

  function doExport() {
    var payload = Store.exportPayload();
    if (!payload.length) {
      UI.toast("还没有已提交的样本，先在标注工作台提交几条", "warn", 3200);
      return;
    }
    UI.modal({
      size: "wide",
      title: "导出训练数据",
      sub: "结构化 JSON · 含标准实体 ID 与所绑定版本，模型训练团队可直接消费",
      body: '<div class="stack-3">' +
        '<div class="row row-2 wrap">' +
        '<span class="chip chip--soft">' + payload.length + " 条样本</span>" +
        '<span class="chip chip--mono">标准库 ' + DB.versions.taxonomy + "</span>" +
        '<span class="chip chip--mono">别名库 ' + DB.versions.alias + "</span>" +
        '<span class="chip chip--mono">规则 ' + DB.versions.rule + "</span></div>" +
        '<pre class="codeblock mono">' + UI.esc(JSON.stringify(payload[0], null, 2)) + "</pre>" +
        '<div class="banner banner--info">' + ico("info", 15) +
        "<span>状态为 FINAL 表示已通过质检 / 仲裁；REVIEW 表示与标准答案存在差异，进入抽检池。</span></div>" +
        "</div>",
      foot: '<div class="spacer"></div><button class="btn btn--ghost" data-close>关闭</button>' +
        '<button class="btn btn--primary" data-dl>' + ico("download", 15) + "下载 JSON</button>"
    }).querySelector("[data-dl]").addEventListener("click", function () {
      UI.download("final_labels_" + Date.now() + ".json", JSON.stringify(payload, null, 2));
      UI.toast("已下载 " + payload.length + " 条最终标签", "ok");
    });
  }

  function renderView() {
    var view = window.Views[Store.state.route];
    if (!view) { Store.go("overview"); return; }
    viewHost.innerHTML = view.render();
    if (view.mount) view.mount(viewHost);
    renderTopbar(view);
    renderRail();
    viewHost.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  function sync() {
    var route = Store.state.route;
    var r = role();
    if (route !== lastRoute || r !== lastRole) {
      lastRoute = route;
      lastRole = r;
      renderView();
      return;
    }
    renderRail();
  }

  Store.subscribe(sync);
  renderView();
  lastRoute = Store.state.route;
  lastRole = role();
})();
</script>
</body>
</html>
